<HTML>

<HEAD>
  <TITLE>Schema Translation</TITLE>
  <STYLE>
    P { font: bold 12pt Verdana }
    PRE { font: 9pt Verdana }
  </STYLE>
<!--TOOLBAR_START-->
<!--TOOLBAR_EXEMPT-->
<!--TOOLBAR_END-->
</HEAD>

<XML id="investments" src="investments.xml"></XML>
<XML id="portfolio"   src="portfolio.xml"></XML>
<XML id="invest2port" src="investments-to-portfolio.xsl"></XML>
<XML id="port2invest" src="portfolio-to-investments.xsl"></XML>

<SCRIPT language="JavaScript">
  function translate1()
  {
    cell2.innerText = investments.transformNode(invest2port.XMLDocument);
  }
  function translate2()
  {
    cell4.innerText = portfolio.transformNode(port2invest.XMLDocument);
  }
</SCRIPT>

<SCRIPT language="JavaScript" for="window" event="onload">
  cell1.innerText = investments.documentElement.xml;
  cell3.innerText = portfolio.documentElement.xml;
</SCRIPT>

<body><script language="javascript">
if (window.name != "content")
    document.write("<center><a href='../../../index.html?page=xml/samples/portfolio/translate.htm'>show framing</a></center>")
</script>

  <P>Source file "investments.xml"</P>
  <PRE id="cell1"></PRE>
  <P>Click here to translate to the "portfolio" grammar 
  <INPUT type="button" value="Translate>>" onclick="translate1()"></P>
  <PRE id="cell2"></PRE>
  
  <HR>
  <P>Source file "portfolio.xml"</P>
  <PRE id="cell3"></PRE>
  <P>Click here to translate to the "investments" grammar
  <INPUT type="button" value="Translate>>" onclick="translate2()"></P>
  <PRE id="cell4"></PRE>
  
</BODY>

</HTML>
