<HTML>
  <HEAD>
    <TITLE>Error Message Demo - script error in the XSL style sheet</TITLE>
<!--TOOLBAR_START-->
<!--TOOLBAR_EXEMPT-->
<!--TOOLBAR_END-->
  </HEAD>
  
  <XML id="source" src="review.xml"></XML>
  <XML id="style" src="review-bad-script.xsl"></XML>
  
  <SCRIPT src="reporterrors.js"></SCRIPT>

  <SCRIPT event="onload" for="window">
    if (source.parseError.errorCode != 0)
      result = reportParseError(source.parseError);
    else
    {
      if (style.parseError.errorCode != 0)
        result = reportParseError(style.parseError);
      else
      {
        try {
          result = source.transformNode(style.XMLDocument);
        }
        catch (exception) {
          result = reportRuntimeError(exception);
        }
      }
    }
    // insert the results into the page
    showResult.innerHTML = result;
  </SCRIPT>

<body><script language="javascript">
if (window.name != "content")
    document.write("<center><a href='../../../index.html?page=xml/samples/review/pg000039.htm'>show framing</a></center>")
</script>
    <P>The XSL style sheet has a runtime error - it contains invalid script.  An error
    should appear below:</P>
    <HR>
    <DIV id="showResult"></DIV>
  </BODY>
</HTML>
