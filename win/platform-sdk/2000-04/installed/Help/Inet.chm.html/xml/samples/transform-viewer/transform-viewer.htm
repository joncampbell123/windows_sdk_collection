<HTML>
  <HEAD>
    <TITLE>Transformation Viewer</TITLE>
<!--TOOLBAR_START-->
<!--TOOLBAR_EXEMPT-->
<!--TOOLBAR_END-->
  </HEAD>

  <SCRIPT>
    function display()
    {
      rawdata.document.write(data.transformNode(defaultss.XMLDocument));
      stylesheet.document.write(ss.transformNode(defaultss.XMLDocument));
      data.transformNodeToObject(ss.XMLDocument, resultTree.XMLDocument);
      result.document.write(resultTree.xml);
      resultsrc.document.write(resultTree.transformNode(defaultss.XMLDocument));
    }
    
    function refresh()
    {
      rawdata.document.body.innerHTML = "";
      stylesheet.document.body.innerHTML = "";
      result.document.body.innerHTML = "";
      resultsrc.document.body.innerHTML = "";
      display();
    }
    
    function changeSource(fileName)
    {
      data.load(fileName);
      refresh();
    }

    function changeStyle(fileName)
    {
      ss.load(fileName);
      refresh();
    }
  </SCRIPT>
  
  <SCRIPT FOR="window" EVENT="onload">
    data.async = false;
    data.load(rawdataHeader.srcurl.value);
    ss.async = false;
    ss.load(stylesheetHeader.srcurl.value);
    display();
  </SCRIPT>
  
  <XML id="data"></XML>
  <XML id="ss"></XML>
  <XML id="defaultss" src="defaultss.xsl"></XML>
  <XML id="resultTree"></XML>

  <FRAMESET COLS="180,*" ROWS="*,*,*,*" FRAMEBORDER="1" FRAMESPACING="5" BORDERCOLOR="black">
    <FRAME ID="rawdataHeader" src="rawdataheader.htm">
    <FRAME ID="rawdata">
    <FRAME ID="stylesheetHeader" src="stylesheetheader.htm">
    <FRAME ID="stylesheet">
    <FRAME ID="resultsrcHeader" src="resultsrcheader.htm">
    <FRAME ID="resultsrc">
    <FRAME ID="resultHeader" src="resultheader.htm">
    <FRAME ID="result">
  </FRAMESET>
</HTML>
