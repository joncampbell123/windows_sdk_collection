<BODY ondragstart="alert(event.srcElement.tagName)" TOPMARGIN=0 LEFTMARGIN=0 BGPROPERTIES="FIXED" BGCOLOR="#FFFFFF" 
LINK="#000000" VLINK="#808080" ALINK="#000000">
<BLOCKQUOTE CLASS="body">

<P>This code detects the <B>tagName</B> of the object from which the <B>ondragstart</B> has originated. Because the event bubbles, it can be handled at the <B>BODY</B> level.
<P><BR>
<INPUT TYPE=text VALUE="Select and drag this text"><P><BR>
