  .cyclingtext {margin-top: 0.25 in; margin-bottom: 0 in;
                font-size: 33pt; font-weight:bold; font-family: Arial,Helvetica; 
                color: gold;  
                text-align:center}

DIV.footer {font-size: 10pt; font-family: Verdana,Arial,Helvetica}

<SCRIPT>
<!-------------------Global Variable Declarations----------------------->
var i;
var iVertical=0;
var iHorizontal=0;
var iInterval=0;
var vTimerID;
var vDelayStart;
var sColor1="white";
var sColor2="gray";
var iColorLoop=0;
var iCurrentCELL=0;
var bAscending=true;
var bNavBarVisible = false;


celColorChange=new Array(iCurrentCELL)

function cycleColors()
{
    if (bAscending)
    {
with(document.all)
celColorChange[iCurrentCELL].style.color=sColor2;
iCurrentCELL++;

if (iCurrentCELL>4)
       {
    bAscending=false;
    iCurrentCELL=4;
       }
    }

    else
    {
with(document.all)
celColorChange[iCurrentCELL].style.color=sColor1;
   iCurrentCELL--;
   if (iCurrentCELL==0)
       {
    bAscending=true;
    changeColors();
       }
    }
}

function changeColors()
{
   switch (iColorLoop)
   {
   case 0:
sColor1="yellow";
sColor2="orange";
break;
   case 1:
sColor1="hotpink";
sColor2="purple";
break;
   case 2:
sColor1="aqua";
sColor2="blue";
break;
   case 3:
sColor1="lightgreen";
sColor2="green";
   }
   iColorLoop++;
   if (iColorLoop>3)
     iColorLoop=0;
}


// Delay start of text movement, waiting for inter-page transition to complete

function pauseStart()
{
  vDelayStart=window.setTimeout("setTimer()", 2200);
}

// Set up interval at which the moveDiv function will be called.

function setTimer()  
{
  vTimerID=window.setInterval("moveDiv()",40);
}  

  
// This function incrementally repositions divMove. It loops through a set
// number of times.

function moveDiv()
{
  divMove.style.visibility= "visible";
  for(i=0;i<10;i++)
    {
       iHorizontal+= 0.35;
       iVertical= 4.75*iHorizontal;
       divMove.style.top=iVertical;
       divMove.style.left=iHorizontal;
    }

//  iInterval tracks how many times moveDiv has looped and clears the interval
//  after a set number of loops.

  iInterval++;
 
  if(iInterval> 25)
     {
        window.clearInterval(vTimerID);
        //divToggle.style.visibility= "visible";
        applyTransition(divToggle);

         setInterval('cycleColors()',100);
     }
}

// Navigation bar-related functions follow
  function FlyFromBottom (oDiv,stopY)
  {
     oDiv.style.pixelTop -= 5;
     if (oDiv.style.pixelTop <= stopY) 
       oDiv.style.pixelTop = stopY;
     else
     {
        copyDiv = oDiv;
        copyY   = stopY;
        window.setTimeout ("FlyFromBottom (copyDiv,copyY);", 10);
     }     
  }

  function FlyFromTop (oDiv,stopY)
  {
     oDiv.style.pixelTop += 5;
     if (oDiv.style.pixelTop >= stopY) 
       oDiv.style.pixelTop = stopY;
     else
     {
        copyDiv = oDiv;
        copyY   = stopY;
        window.setTimeout ("FlyFromTop (copyDiv,copyY);", 10);
     }     
  }

  function flyIn()
  { 

     navBar.style.pixelTop = document.body.offsetHeight;
     navBar.style.visibility= "visible";
     window.setTimeout ("FlyFromBottom (navBar,document.body.offsetHeight - 35);",10);
    
  }

  function flyOut()
  { 

     navBar.style.pixelTop = document.body.offsetHeight - 35;
     navBar.style.visibility= "visible";
     window.setTimeout ("FlyFromTop (navBar,document.body.offsetHeight);",10);
    
  }

  function slideNav()
  {
     if (!bNavBarVisible)
     {
        if ((event.x <= 200) && (event.y >= document.body.offsetHeight - 35))
        {
           bNavBarVisible = true;
           flyIn();
         
        }
     }

     else if ((event.x > 200) || (event.y < document.body.offsetHeight - 50))
     {
       bNavBarVisible = false;   
       flyOut ();
     }
      
  }


function applyTransition (oImg)
{
   oImg.filters[0].Apply();
   oImg.style.visibility = "visible";
   oImg.filters[0].Play();
}

  function switchSlides()
  {

     // if any of the navigation buttons were pressed,
     // determine which button was pressed, and set cancelBubble = true;
     if (event.srcElement.tagName == "INPUT")
     {
        // go to next or previous
        if (event.srcElement.title == "First")
           location.href= "/workshop/samples/author/dhtml/howto/s1.htm";

        else if (event.srcElement.title == "Previous")
           location.href = "/workshop/samples/author/dhtml/howto/s1.htm";

        else if (event.srcElement.title == "Next")
           location.href = "/workshop/samples/author/dhtml/howto/s3.htm";

        else if (event.srcElement.title == "Last")
           location.href = "/workshop/samples/author/dhtml/howto/s7.htm";
       
        // cancelBubble so it doesn't bubble up
        event.cancelBubble = true;
     }

     else
        location.href="/workshop/samples/author/dhtml/howto/s3.htm";
     
  }

</SCRIPT>
