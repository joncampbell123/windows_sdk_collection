<LINK REL="stylesheet" href="samplessdkie4.css" TYPE="text/css">

<SCRIPT>
function boundDim(element) {
var t = document.all.tags("TEXTAREA");
if (t != null) {
var r = element.createTextRange();
if (r != null) {
alert("The boundingWidth is \n" + r.boundingWidth);
alert("The boundingHeight is \n" + r.boundingHeight);
alert("The boundingLeft is \n" + r.boundingLeft);
alert("The boundingTop is \n" + r.boundingTop);
}
}
}
</SCRIPT>
</HEAD>
