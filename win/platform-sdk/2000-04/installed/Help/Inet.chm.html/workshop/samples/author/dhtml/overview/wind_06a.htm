<Title>Search Dialog</Title>
<SCRIPT>
<!--
function doOK()
{
   window.returnValue=searchText.value;
   window.close()
}

function doCancel()
{
   // return a special known value if the user chooses cancel
   window.returnValue=-1; 
   window.close();
}
-->
</SCRIPT>

<BLOCKQUOTE CLASS="body">

<DIV STYLE="margin-left:80;margin-top:20">
Enter text to search for:
<INPUT ID="MySearch" TYPE=text Name=searchText>

<P><INPUT type=button onclick="doOK()" value=OK>&nbsp;
<INPUT type=button onclick="doCancel()" value=Cancel></P>
</DIV>
