<H1>Redirect Filter Effect Example</H1>
<!-- CONTENTS_END -->

<!-- Instantiate the DAControl object -->
<OBJECT ID="DAControl"
  STYLE="position:absolute; left:200; top:125; width:350; height:300; z-index: -1"
  CLASSID="CLSID:B6FFC24C-7E13-11D0-9B47-00C04FC2F51D">
</OBJECT>

<P>The rotating image below is a <B>DIV</B> object that has been converted into a Microsoft&#174; DirectAnimation&#153; image (DAImage). Once converted, the DAImage can be used for 2-D operations or as a 3-D texture.</P>


<DIV ID="oDiv" STYLE="WIDTH:250; FILTER: Redirect()">
<H2>This is the DIV after being converted into an image.</H2>
<P><img src="../../../../workshop/samples/author/dhtml/graphics/sphere.jpg"></P>
</DIV>

<SCRIPT LANGUAGE="JScript">
<!--

    // The DirectAnimation library
    oLib = DAControl.MeterLibrary;

    // get the filter
    oFilter = oDiv.filters[0];
    
    // grab the image converted by the filter
    oImage = oFilter.ElementImage();
  
    // perform the image transformation
    DAControl.Image = oImage.Transform(oLib.Rotate2RateDegrees(30)) ;  
    DAControl.Start();

-->
</SCRIPT>
</DIV>
