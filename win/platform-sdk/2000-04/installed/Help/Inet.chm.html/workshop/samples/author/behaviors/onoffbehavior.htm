<HTML>
<HEAD> 
<TITLE>onOffBehavior</TITLE>
<META HTTP-EQUIV="Content-Type" CONTENT="text/html; CHARSET=iso-8859-1">
<META NAME="AUTHOR" CONTENT="InetSDK">
<META NAME="MS.LOCALE" CONTENT="EN-US">

<!-- SAMPLE_STYLE_START -->
<LINK REL="stylesheet" href="../../../../workshop/basicsdkie4.css" TYPE="text/css">
<!-- SAMPLE_STYLE_END -->
<XML:NAMESPACE PREFIX="anim"/>
<STYLE>
.time        { behavior: url(#time);       }
anim\:DA{ behavior: url(#default#anim); }
</STYLE>
<OBJECT ID="time" CLASSID="CLSID:476c391c-3e0d-11d2-b948-00c04fa32195"></OBJECT>
</HEAD>
<!--TOOLBAR_START-->
<!--TOOLBAR_EXEMPT-->
<!--TOOLBAR_END-->

<BODY TOPMARGIN=0 LEFTMARGIN=0 BGPROPERTIES="FIXED" BGCOLOR="#FFFFFF" 
LINK="#000000" VLINK="#808080" ALINK="#000000">

<BLOCKQUOTE CLASS="body">
<P>Initially, an image of the sun is displayed before the DirectAnimation behavior starts. Five seconds later a new image replaces the image of the sun. The new image fades until it disappears after five seconds of animation. When the animation stops, the original image of the sun reappears.
</P>


<SPAN ID="spanImg" CLASS="time" t:TIMEACTION="visibility" t:BEGIN="5" t:DUR="5">
</SPAN>
<DIV ALIGN="center">
<anim:DA ID="da1" STYLE="width:504; height:126; z-index: -1;"/>
</DIV>
<BR>
<BUTTON onclick="spanImg.beginElement();">Restart Animation</BUTTON>

<SCRIPT LANGUAGE="JScript">
<!--
   // Assign a variable to the DA statics library
   m = da1.statics;
   // Create the DAImages
   img1 = m.ImportImage("/workshop/graphics/solarsys.gif");   
   img2 = m.ImportImage("/workshop/graphics/sun.gif");
   // Display image 1 while the behavior is running, and 
   // image 2 while it is stopped.
   img3 = m.Cond(spanImg.onOffBehavior, img1, img2)
   // Animate the opacity of the image from 100% to 0%, based on the progress
   // of the time behavior. Use (1 - progress) to get the proper opacity.
   img4 = img3.OpacityAnim(m.Sub(m.DANumber(1),spanImg.progressBehavior));  
   // Set the image of the DA Object to be the final image behavior
   da1.image = img4;    
//-->  
</SCRIPT>
</BLOCKQUOTE>
</BODY>
</HTML>
