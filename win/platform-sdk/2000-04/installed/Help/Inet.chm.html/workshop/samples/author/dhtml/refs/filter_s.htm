<TITLE>filter</TITLE>

<LINK REL="stylesheet" href="samplessdkie4.css" TYPE="text/css">

<SCRIPT>

function doFilter () {
filterFrom.filters.item(0).Apply();
filterFrom.filters.item(0).Transition=12;   // 12 IS THE DISSOLVE FILTER
imageFrom.style.visibility = "hidden";
filterTo.style.visibility = "";
filterFrom.filters.item(0).play(14);
}

</SCRIPT>
</HEAD>
<!--TOOLBAR_START-->
<!--TOOLBAR_EXEMPT-->
<!--TOOLBAR_END-->

<BODY TOPMARGIN=0 LEFTMARGIN=0 BGPROPERTIES="FIXED" BGCOLOR="#FFFFFF" 
LINK="#000000" VLINK="#808080" ALINK="#000000">
<BLOCKQUOTE CLASS="body">

<P>Click on the image to start the filter.<BR>
<DIV ID="filterFrom" onclick="doFilter()"
STYLE="position:absolute;
width:200;
height:250;
background-color:white;
filter:revealTrans()">     <!-- CALL THE FUNCTION -->
<IMG ID="imageFrom"
STYLE="position:absolute;
top:20;
left:20;"
src="../../../../../workshop/samples/author/dhtml/graphics/sphere.jpg" height="80" width="80" border="0" border="0" alt="sphere">

<DIV ID="filterTo"
STYLE="position:absolute;
width:200;
height:250;
top:20;
left:20;
background:white;
visibility:hidden;">
</DIV>
</DIV>
<DIV STYLE="position:absolute;top:200">
<BR>
