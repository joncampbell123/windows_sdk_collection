<SELECT ID="oID_1" SIZE=3 MULTIPLE>
<OPTION>Item 1</OPTION>
<OPTION>Item 2</OPTION>
<OPTION>Item 3</OPTION>
</SELECT>

<P>Click below to determine whether multiple items may be selected from the list. The page is loaded with the <B>MULTIPLE</B> attribute set on the <B>SELECT</B> element.</P>

<SPAN id="oSpan">
</SPAN>
<P>
<BUTTON onclick="oID_1.multiple=false; oSpan.innerText=''">One</BUTTON>
<BUTTON onclick="oID_1.multiple=true; oSpan.innerHTML='<BR>(<B>Note</b> You can select more than one item in the list by holding down the left mouse button and moving the cursor over one or more items.)'">Many</BUTTON></P>
