<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.0 Transitional//EN">
<HTML>
<HEAD>
<TITLE>border</TITLE>
<META HTTP-EQUIV="Content-Type" CONTENT="text/html; CHARSET=iso-8859-1">
<META NAME="AUTHOR" CONTENT="InetSDK">
<META NAME="MS.LOCALE" CONTENT="EN-US">

<LINK REL="stylesheet" href="samplessdkie4.css" TYPE="text/css">

<!-- HERE WE SET THE STYLE RULES: -->

<STYLE>
.applyBorder {Border:"0.2cm GROOVE ORANGE"}
.removeBorder {Border:""}
</STYLE>
</HEAD>
<!--TOOLBAR_START-->
<!--TOOLBAR_EXEMPT-->
<!--TOOLBAR_END-->

<BODY TOPMARGIN=0 LEFTMARGIN=0 BGPROPERTIES="FIXED" BGCOLOR="#FFFFFF" LINK="#000000" VLINK="#808080" ALINK="#000000">
<BLOCKQUOTE CLASS="body">

<CENTER>
<P>The sphere image is loaded in a table. Mouseover the sphere
to change the border to "0.2cm <B>GROOVE ORANGE</B>" by calling the style rule.</P>

<TABLE BORDER>
<TR>
<TD ALIGN="middle" VALIGN="center">
<IMG src="../../../../../workshop/samples/author/dhtml/graphics/cone.jpg" height="80" width="80" alt="cone image"></TD>


<!-- HERE ARE THE EVENTS THAT CALL THE RULES ABOVE IN <STYLE>: -->
  
<TD onmouseover="this.className='applyBorder'" onmouseout="this.className='removeBorder'" ALIGN="middle" VALIGN="center">
<IMG src="../../../../../workshop/samples/author/dhtml/graphics/sphere.jpg" height="80" width="80" alt="sphere image"></TD>
<TD ALIGN="middle" VALIGN="center">
<IMG src="../../../../../workshop/samples/author/dhtml/graphics/cone.jpg" height="80" width="80" alt="cone image"></TD>
</TR>
</TABLE>


<BR><BR><BR>
