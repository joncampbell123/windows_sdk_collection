<BODY onLoad="sphere.style.border='0.2cm RIDGE RED'" TOPMARGIN=0 LEFTMARGIN=0 BGPROPERTIES="FIXED" BGCOLOR="#FFFFFF" LINK="#000000" VLINK="#808080" ALINK="#000000">
<BLOCKQUOTE CLASS="body">

<CENTER>
<P>The sphere image is loaded in a table with a border style of "0.2cm <B>RIDGE RED</B>"
around the sphere. Mouseover the sphere to change the border style to "0.2cm <B>GROOVE PINK</B>".</P>

<TABLE>
<TR>
<TD ALIGN="center" VALIGN="middle">
<IMG src="../../../../../workshop/samples/author/dhtml/graphics/cone.jpg" height="80" width="80" border=0 alt="cone image"></TD>

<!-- HERE ARE THE EVENTS THAT CALL THE RULES IN THE FUNCTION: -->
  
<TD ID="sphere" onmouseover="sphere.style.border='0.2cm GROOVE PINK'"
onmouseout="sphere.style.border='0.2cm RIDGE RED'" ALIGN="center" VALIGN="middle">
<IMG src="../../../../../workshop/samples/author/dhtml/graphics/sphere.jpg" height="80" width="80" border=0 alt="sphere image"></TD>
<TD ALIGN="center" VALIGN="middle">
<IMG src="../../../../../workshop/samples/author/dhtml/graphics/cone.jpg" height="80" width="80" border=0 alt="cone image"></TD>
</TR>
</TABLE>
