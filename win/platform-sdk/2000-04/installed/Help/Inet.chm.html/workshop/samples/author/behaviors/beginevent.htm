<BLOCKQUOTE CLASS="body">
<P>Click the following button to display a paragraph one second later. The paragraph will remain displayed for five seconds.</P><BR><BR>
<BUTTON ID="button1">Show Paragraph</BUTTON><BR><BR>
<SPAN ID="span1" CLASS=time STYLE="COLOR:Red;" t:BEGINEVENT="button1.onclick" t:BEGIN="1" t:DUR="5" t:TIMEACTION="display">
<H3>Paragraph 1</H3>
<P>This is paragraph number one. It appears one second after the button was pressed.</P>
</SPAN>
