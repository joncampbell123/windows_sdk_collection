<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.0 Transitional//EN">
<HTML>
<HEAD>
<TITLE>Dynamic Positioning</TITLE>
<META HTTP-EQUIV="Content-Type" CONTENT="text/html; CHARSET=iso-8859-1">
<META NAME="AUTHOR" CONTENT="InetSDK">
<META NAME="MS.LOCALE" CONTENT="EN-US">

<STYLE>
BODY           { background: black;color: gold;font: 36pt sans-serif bolder;  }
.DiagonalText  { position:absolute;top:0;left:0; }
.DisplayText   { position:absolute;top:300;left:330;width:200;color:red;visibility:hidden;  }
</STYLE>
<SCRIPT>
<!-------------------Global Variable Declarations----------------------->
var i;
var iVertical=0;
var iHorizontal=0;
var iInterval=0;
var vTimerID;
var vDelayStart;
<!---------------------------------------------------------------------->

// Included a setTimeout in BODY onload to delay start of text movement.

function pauseStart()
{
  vDelayStart=window.setTimeout("setTimer()", 500);
}


// Set up interval at which the moveDiv function will be called.

function setTimer()  
{
  vTimerID=window.setInterval("moveDiv()",40);
}  

  
// This function incrementally repositions divMove. It loops through a set
// number of times.

function moveDiv()
{
  for(i=0;i<10;i++)
    {
       iHorizontal+= 1;
       iVertical=iHorizontal;
       divMove.style.top=iVertical;
       divMove.style.left=iHorizontal;
    }

//  iInterval tracks how many times moveDiv has looped and clears the interval
//  after a set number of loops.

  iInterval++;
 
  if(iInterval>25)
     {
        window.clearInterval(vTimerID);
        divToggle.style.visibility="visible";
     }
}
</SCRIPT>
</HEAD>
<!--TOOLBAR_START-->
<!--TOOLBAR_EXEMPT-->
<!--TOOLBAR_END-->

<BODY onload="pauseStart()" TOPMARGIN=0 LEFTMARGIN=0 BGPROPERTIES="FIXED" BGCOLOR="#000000" LINK="#000000" VLINK="#808080" ALINK="#000000">
<BLOCKQUOTE CLASS="body">

<DIV ID="divMove" CLASS="DiagonalText"> 
Dynamic
</DIV>
<DIV ID="divToggle" CLASS="DisplayText">
Positioning
</DIV>

<FONT FACE="VERDANA,ARIAL,HELVETICA" SIZE="2">
<DIV STYLE="position:relative;top:325;LEFT:10">

</DIV>

</BLOCKQUOTE>
</BODY>
</HTML>
