<!-- STYLE NOTE

The styles cover several basic game components.
The two critical gaming styles are GAMEPIECE and GAMEBOARD.
Since all of the objects are added dynamically, they are inserted into a DIV called the GAMEBOARD.
The dynamic objects are considered GAMEPIECES, and thus both the GAMEPIECES and GAMEBOARD have the respective styles to start.

The rest of the styles are used for displaying the scratch pad and the game numbers.

-->

<style>
BODY {background-color: "#000000"; color: "#FFFFFF"; font-family: Arial; font-size: 8pt;}
.gamepiece{position: absolute; top: 0; left: 0; display: none; z-index: 10;}
.gameboard{position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: #000000; color: #FFFFFF;}
.scratch {overflow: auto; position: absolute; width: 200; height: 200; top: 0; left: 0; background-color: "#C0C0C0"; border: "1 solid"; border-top-color: "#CFCFCF"; border-left-color: "#CFCFCF"; border-right-color: "#505050"; border-bottom-color: "#505050"; z-index: 100;}
.scratchlabel {font-family: Arial; font-size: 8pt; color: "#FF0000"; font-weight: bold;}
.scratchdata {font-family: Arial; font-size: 8pt; color: "#FFFFFF"; font-weight: normal;}
.displaytext{position: absolute; left: 10; color: "#FFFF00"; font-size: 12pt; font-weight: bold; font-family: Arial;}
.displaybutton{filter: alpha(opacity=50); position: absolute; left: 10; color: "#FFFFFF"; font-size: 8pt; font-family: Arial; background-color: "#000000";}
</style>
<script>

// GAME VARIABLES
var aImageCache=new Array();// Array used to cache all images.
var iCycle=0;// Numeral used to refer to the current array when caching images, and also as an counter for bonus commands.
var iGameBoardWidth=0;// The width of the DIV used for the game board.
var iGameBoardHeight=0;// The height of the DIV used for the game board.
var iCurrentTop=0;// The current value of an object's top property that is being repositioned.
var iCurrentLeft=0;// The current value of an object's left property that is being repositioned.
var iGameCounter=0;// Numerate the number of game cycles (each time something is repositioned).
var iScore=0;// The current score.
var iGuys=4;// The number of lives left.
var iGameTimerID=0;// Placeholder for the window object's interval.  Used to stop the interval when the level advances or is reset.
var iLevel=1;// The current level.
var bLoadGame=false;// Boolean used to perform actions only one time when the page loads (e.g.: caching images);
var bGameOver=false;// Boolean used to determine if the level ended when all ship wedges were destroyed.
var iTimerCycle=1;// The number in milliseconds of how often to reposition objects.
var iAnimDelay=0;
var iAnimCells=3;
var bSetLog=false;

// ROCK VARIABLES
var iStartRockCount=1;// Number of rocks to start the game with.
var iActiveRocks=0;// How many active rocks are there in the game at any given time.
var iRockCount=0;// The numerical counter for the number of rocks added.
var oCurrentRock="";// Placeholder when referring to a particular rock object.
var iMaxRockSpeed=7;// Maximum speed of a rock.
var iMinRockSpeed=iMaxRockSpeed/2;// Minimum speed of a rock.
var oSplitRock1="";// Placeholder when splitting a rock into two rocks.
var oSplitRock2="";// Placeholder when splitting a rock into two rocks.
var bSplitRocks=false;// Boolean used for splitting rocks with the function for adding new rocks.
var aSizeFactors=new Array(60,30,15);// Static array of the sizes of the rock images (they are square, so height and width are the same).
var iStartRockIter=1;// Rock images are numerated.  Start with this number when referring to the first image.
var iEndRockIter=3;// Rock images are numerated.  Stop with this number when referring to the last image.
var iFactor1=0;// Placeholder for current speed factor when splitting rocks.
var iFactor2=0;// Placeholder for new speed factor when splitting rocks.

// SHIP VARIABLES
var iConvertLeft=0;// The current left value of the ship when it is accelerating.
var iConvertTop=0;// The current top value of the ship when it is accelerating.
var iShipDirection=0;// Placeholder for the direction of the ship (1 - 16)
var iRADDirection=0;// Placeholder for the direction of the ship in radians.
var iCacheDx=0;// Placeholder for the sine value of the ship's direction in radians.
var iCacheDy=0;// Placeholder for the cosine value of the ship's direction in radians.
var iActiveLasers=0;// The number of lasers currently zooming around the screen.
var oLaser="";// Placeholder for a particular laser object that is zooming around the screen.
var iTotalLasers=3;// Maximum number of lasers that the ship can fire.
var iLaserSpeed=20;// Speed of a laser object.
var iLaserRange=12;// Maximum range of a laser object.
var bShipMoved=false;// Boolean to see if the ship moved - used to prevent sudden death in the game when it first starts.
var iShieldCount=25;// Bonus Number - Can you figure out what it does?


// When the page loads, the level advances, or the game ends, this function is called.
function fnInit(){

// Clear the scratch and game board objects of all inner values.
oScratch.innerHTML="";
oGameBoard.innerHTML="";

// The fnSetLog function is used to monitor the process of the game's script.
fnSetLog("Page Init","Initializing the page");

// Initialize the starting variables 
fnSetLog("Display","Setting up the display");
oScratch.style.display="none";
fnInitVariants();

// Add the ship, the rocks, and the lasers to the gameboard.
fnAddShip();
fnAddRocks(iStartRockCount,1);
fnAddLasers();

// If this is the first time this function is called, show the intro screen and cache the images.
if(bLoadGame==false){
oIntro.innerHTML='Press Any Key to Start Game<p align=center>J - Rotate Left<br>L - Rotate Right<br>K - Accelerate<br>SPACE - Fire</P>';
bLoadGame=true;
fnInitGame();
}
// Otherwise, prepare the ship and start the game.
else{
fnEnableShip();
}
fnSetLog("Master Timer","The primary timer has been set.");
iCycle=0;
// Make sure the body has focus for capturing key events
document.body.focus();
// Call the fnMasterTime function to begin the gaming clock
fnMasterTimer();
}

// Call function to cache game images and show startup screen.
function fnInitGame(){
fnCacheImages();
oIntro.style.display="block";
oIntro.style.left=iGameBoardWidth/2 - oIntro.style.pixelWidth/2;
oIntro.style.top=iGameBoardHeight/2 - oIntro.style.pixelHeight/2;
document.body.onkeypress=fnPreKeyHandler;
}

// Setup the game variables.
function fnInitVariants(){
iGameBoardWidth=oGameBoard.offsetWidth;
iGameBoardHeight=oGameBoard.offsetHeight;
oScratch.style.left=iGameBoardWidth - oScratch.offsetWidth;
}

// Start the game timer using the setInterval method.
function fnMasterTimer(){
iGameTimerID=window.setInterval("fnGameClock();",iTimerCycle,"JavaScript");
}

// ADD OBJECTS TO THE GAMEBOARD

// Add the ship
function fnAddShip(){
fnSetLog("Init Ship","Adding ship image");
oGameBoard.innerHTML+='<img shields="inactive" class="gamepiece" id="oShip" src="../../../../../workshop/samples/author/dhtml/graphics/s1.gif" width=50 height=50>';
oGameBoard.innerHTML+='<img id=oShield src="../../../../../workshop/samples/author/dhtml/graphics/shield.gif" width=50 height=50 class="gamepiece">';
fnBuildShip();
}


// Add rocks.  If the rocks being added aren't split, then assign random startup locations.
function fnAddRocks(iCount,iFactor){
for(var i=0;i<iCount;i++){
iRockCount++;
iActiveRocks++;
oGameBoard.innerHTML+='<img animcycle=0 animcount=0 status="active" class="gamepiece" id="oRock' + iRockCount + '" src="../../../../../workshop/samples/author/dhtml/graphics/rock' + iFactor + '.gif" width=' + aSizeFactors[iFactor-1] + ' height=' + aSizeFactors[iFactor-1] + '>';
oCurrentRock=eval("oRock" + iRockCount);
if(bSplitRocks==false){
oCurrentRock.style.top=Math.random()*document.body.clientHeight;
oCurrentRock.style.left=Math.random()*document.body.clientWidth;
}
fnBuildRock(oCurrentRock,iFactor);
}
}

// Add the lasers.
function fnAddLasers(){
fnSetLog("Init Lasers","Adding objects for lasers");
for(var i=1;i<=iTotalLasers;i++){
oGameBoard.innerHTML+='<img status="standby" class="gamepiece" id="oLaser' + i + '" height=2 width=2 src="../../../../../workshop/samples/author/dhtml/graphics/laser.gif">';
oWorkItem=eval("oLaser" + i);
oWorkItem.style.left=0;
oWorkItem.style.top=0;
oWorkItem.style.display="none";
}
}

// AFTER ADDING OBJECTS, SET INITIAL SETTINGS


function fnBuildRock(oWorkItem,iFactor){
oWorkItem.style.display="block";
oWorkItem.dx=(Math.round(Math.random() * iMaxRockSpeed) - iMinRockSpeed) * iFactor + 1;
oWorkItem.dy=(Math.round(Math.random() * iMaxRockSpeed) - iMinRockSpeed) * iFactor + 1;
oWorkItem.factor=iFactor;
}

// Setup the ship's settings.  These include the necessary decimal and radian direction values.
function fnBuildShip(){
fnSetLog("Init Ship","Setting ship position");
oShip.style.left=parseInt(iGameBoardWidth/2);
oShip.style.top=parseInt(iGameBoardHeight/2);
oShip.shieldcount=iShieldCount;
iShipDirection=1.1;
oShip.dx=0;
oShip.dy=0;
iRADDirection=(((iShipDirection - 1) * 22.5) / 180) * 3.14159;
iCacheDx = Math.sin(iRADDirection);
iCacheDy = Math.cos(iRADDirection) * - 1;
iShipDirection=1;
}

// Cache images used for the game for quick access.
function fnCacheImages(){
fnSetLog("Cache","Adding game images to runtime cache.");
iCycle=0;
for(var i=0;i<16;i++){
iCycle++;
aImageCache[iCycle]=new Image();
aImageCache[iCycle].src="../../../../../workshop/samples/author/dhtml/graphics/s" + i + ".gif";
}
for(var i=iStartRockIter;i<iEndRockIter;i++){
iCycle++;
aImageCache[iCycle]=new Image();
aImageCache[iCycle].src="../../../../../workshop/samples/author/dhtml/graphics/rock" + i + ".gif";
iCycle++;
aImageCache[iCycle]=new Image();
aImageCache[iCycle].src="../../../../../workshop/samples/author/dhtml/graphics/rock" + i + "e1.gif";
iCycle++;
aImageCache[iCycle]=new Image();
aImageCache[iCycle].src="../../../../../workshop/samples/author/dhtml/graphics/rock" + i + "e2.gif";
iCycle++;
aImageCache[iCycle]=new Image();
aImageCache[iCycle].src="../../../../../workshop/samples/author/dhtml/graphics/rock" + i + "e3.gif";
}
}

// Display information about the script's processes during run-time.
function fnSetLog(sID,sText){
if(bSetLog==true){
oScratch.innerHTML+='<span class="scratchlabel">' + sID + '</span> <span class="scratchdata">' + sText + '</span><br>';
}
}

// GAME CLOCK
function fnGameClock(){
var i;
iGameCounter++;

// Check to see if a laser has made contact with a rock.
fnDetermineContact();

// Check to see if the ship has made contact with a rock.
fnDetermineCrash();

// Check to see if there are any more rocks.
fnDetermineGameOver();

// Check to see if the ship should be moved.

if ((oShip.dx != oShip.dy ) && (oShip.dx != 0)) {
fnRepos(oShip);
}

// If there are any laser objects, check to see if they are still within their range limit.  If so, move them.  If not, hide and disable them.
if(iActiveLasers>0){
for(var i=1;i<=iTotalLasers;i++){
oLaser=eval("oLaser" + i);
if(oLaser.status=="active"){
oLaser.round++;
if(oLaser.round > iLaserRange){
oLaser.style.display="none";
oLaser.status="standby";
iActiveLasers--;
}
else{
fnRepos(oLaser);
}
}
}
}

// If any of the rocks on the gameboard are active, move them.
for(var i=1;i<=iRockCount;i++){
var oCurrentRock=eval("oRock" + i);
if(oCurrentRock.status=="active"){
fnRepos(oCurrentRock);
}
if(oCurrentRock.status=="explode"){
fnAnimateExplosion(oCurrentRock);
}
}
// Bonus commands .. can you figure out what it's for?
if(oShip.shields=="active"){
if(oShip.shieldcount>0){
oShip.shieldcount--;
}
else{
fnShield();
}
}
if((oShip.shieldcount<iShieldCount)&&(oShip.shields=="inactive")){
iCycle++;
if(iCycle>=4){
oShip.shieldcount++;
iCycle=0;
}
}

}
function fnAnimateExplosion(oExplode){
if(oExplode.animcycle>iAnimDelay){
oExplode.animcycle=0;
oExplode.animcount++;
if(oExplode.animcount>iAnimCells){
fnSetLog("Explode","Should hide rock");
oExplode.animcount=0;
oExplode.status="inactive";
oExplode.style.display="none";
}
else{
//alert(oExplode.src.substring(0,oExplode.src.indexOf("rock") + 4) + "e" + oExplode.animcount + ".gif");
//fnSetLog("Anim",oExplode.src.substring(0,oExplode.src.indexOf("rock") + 5) + "e" + oExplode.animcount + ".gif");
oExplode.src=oexplode.src.substring(0,oexplode.src.indexof("rock") + 5) + "e" + oExplode.animcount + ".gif";
}
}
else{
oExplode.animcycle++;
}

}
// REPOSITION ITEMS FOR EACH GAME CYCLE
function fnRepos(oWorkItem) {
// Only reposition items that are set active.
if(oWorkItem.status=="active"){
oWorkItem.ilastleft=oWorkItem.style.posLeft;
oWorkItem.ilasttop=oWorkItem.style.posTop;
oWorkItem.style.posLeft+=parseFloat(oWorkItem.dx);
oWorkItem.style.posTop+=parseFloat(oWorkItem.dy);
iCurrentLeft=oWorkItem.style.posLeft;
iCurrentTop=oWorkItem.style.posTop;

if((oShip.shields=="active")&&(oWorkItem.id=="oShip")){
oShield.style.posLeft=oWorkItem.style.posLeft;
oShield.style.posTop=oWorkItem.style.posTop;
}

/* CATCH GAMECLOCK ERROR */

if((iCurrentLeft==oWorkItem.ilastleft)&&(iCurrentTop==oWorkItem.ilasttop)&&(oWorkItem.id.indexOf("oRock")!=-1)){
fnSetLog("ERROR","D-Sync Computation Error.  Will try to recover.");
fnBuildRock(oWorkItem,oWorkItem.factor);
return;
}
// If the object is outside of the gameboard after being moved, wrap it around to the opposite side.
if (iCurrentLeft<0){
oWorkItem.style.left=iGameBoardWidth-oWorkItem.offsetWidth;
}
else if (iCurrentLeft+oWorkItem.offsetWidth > iGameBoardWidth) {
oWorkItem.style.left=0;
}
if (iCurrentTop<0) {
oWorkItem.style.top=iGameBoardHeight-oWorkItem.offsetHeight;
}
else if (iCurrentTop+oWorkItem.offsetHeight > iGameBoardHeight) {
oWorkItem.style.top=0;
}
}
}
// Capture keyboard events and process them here.
function fnKeyHandler(){
if(oShip.status=="active"){
bShipMoved=true;
var iKeyCode=event.keyCode;
if(iKeyCode==114){
fnReInit();
}
if(iKeyCode==99){
fnEnableCheat();
}
if(iKeyCode==115){
fnShield();
}
if(iKeyCode==106){
fnRotateLeft();
}
if(iKeyCode==108){
fnRotateRight();
}
if(iKeyCode==107){
fnAccelerate();
}
if(iKeyCode==32){
fnAttack();
}
}
}
function fnPreKeyHandler(){
oIntro.style.display="none";
document.body.onkeypress=fnKeyHandler;
if(bGameOver==true){
bGameOver=false;
iScore=0;
iStartRockCount=1;
iRockCount=0;
iWedges=4;
fnInit();
}
else{
fnEnableShip();
}
}

function fnRotateLeft() {
if (iShipDirection == 1) {
iShipDirection=16;
oShip.src="../../../../../workshop/samples/author/dhtml/graphics/s16.gif";
}
else {
iShipDirection-=1;
oShip.src="../../../../../workshop/samples/author/dhtml/graphics/s"+ishipdirection+".gif";
}
iRADDirection=(((iShipDirection - 1) * 22.5) / 180) * 3.14159;
iCacheDx = Math.sin(iRADDirection);
iCacheDy = Math.cos(iRADDirection) * - 1;
}

function fnRotateRight() {
if (iShipDirection == 16) {
iShipDirection = 1;
oShip.src = "../../../../../workshop/samples/author/dhtml/graphics/s1.gif";
}
else {
iShipDirection += 1;
oShip.src = "../../../../../workshop/samples/author/dhtml/graphics/s"+ishipdirection+".gif";
}
iRADDirection = (((iShipDirection - 1) * 22.5) / 180) * 3.14159;
iCacheDx=Math.sin(iRADDirection);
iCacheDy=Math.cos(iRADDirection) * - 1;
}

function fnAccelerate() {
iConvertLeft=(parseFloat(oShip.dx) + iCacheDx);
iConvertTop=(parseFloat(oShip.dy) + iCacheDy);
oShip.dx=iConvertLeft;
oShip.dy=iConvertTop;

}

/* FIRE THE LASER */

function fnDetermineLaser(){
for(var i=1;i<=iTotalLasers;i++){
oLaser=eval("oLaser" + i);
if(oLaser.status=="standby"){
return oLaser;
break;
}
}
return "Invalid";
}

function fnAttack(){
if(iActiveLasers<iTotalLasers){
iActiveLasers++;
oCurrentLaser=fnDetermineLaser();
if(oCurrentLaser!="Invalid"){
oCurrentLaser.status="active";
oCurrentLaser.dy=0;
oCurrentLaser.dx=0;
oCurrentLaser.round=0;
oCurrentLaser.style.top=oShip.style.posTop + 25;
oCurrentLaser.style.left=oShip.style.posLeft + 25;
oCurrentLaser.dx=iCacheDx * iLaserSpeed;
oCurrentLaser.dy=iCacheDy * iLaserSpeed;
oCurrentLaser.style.display="block";
}
}
}

function fnDetermineContact(){
if(iActiveLasers>0){
for(var i=1;i<=iTotalLasers;i++){
oLaser=eval("oLaser" + i);
if(oLaser.status=="active"){
oWorkItem=document.elementFromPoint(oLaser.offsetLeft, oLaser.offsetTop);
if(oWorkItem!=null){
if((oWorkItem.id.indexOf("Rock")!=-1)&&(oWorkItem.status=="active")){
oLaser.status="standby";
oLaser.style.display="none";
iActiveLasers--;
iActiveRocks--;
fnRecordScore(oWorkItem);
fnSplitRock(oWorkItem);
}
}
}
}
}
}

function fnSplitRock(oRock){
iFactor1=oRock.factor;
iFactor2=parseInt(iFactor1) + 1;
if(iFactor1==iEndRockIter){
/* Watch for image alignment problems */
oRock.src="../../../../../workshop/samples/author/dhtml/graphics/rock" + iFactor1 + "e1.gif";
oRock.status="explode";
//oRock.style.display="none";
oRock.dx=0;
oRock.dy=0;
}
else{
oRock.dx=0;
oRock.dy=0;
//oRock.style.display="none";
oRock.status="explode";
oRock.src="../../../../../workshop/samples/author/dhtml/graphics/rock" + iFactor1 + "e1.gif";
bSplitRocks=true;
fnAddRocks(2,iFactor2);
oSplitRock1=eval("oRock" + (iRockCount-1));
oSplitRock2=eval("oRock" + iRockCount);
oSplitRock1.style.top=oRock.style.top;
oSplitRock1.style.left=oRock.style.left;
oSplitRock2.style.top=oRock.style.top;
oSplitRock2.style.left=oRock.style.left;
//fnBuildRock(oSplitRock1,iFactor2);
//fnBuildRock(oSplitRock2,iFactor2);
bSplitRocks=false;
return false;
}
}

function fnDetermineCrash() {
oWorkItem=document.elementFromPoint(oShip.offsetLeft + 25, oShip.offsetTop+25);
if (oWorkItem.id.indexOf("Rock")!=-1){
if(oWorkItem.status=="active"){
if((iGameCounter>100)&&(bShipMoved==true)&&(oShip.status=="active")){
iActiveRocks--;
fnSplitRock(oWorkItem);
fnRecordScore(oWorkItem);
if(oShip.shields=="inactive"){
oShip.status="dead";
fnSetLog("Carnate","Ship was destroyed");
fnReincarnate();
}
}
}
}
}
function fnRockStatus(){
oScratch.innerHTML="";
for(var i=1;i<=iRockCount;i++){
var oCurrentRock=eval("oRock" + i);
if(oCurrentRock.status=="active"){
fnSetLog("Rock " + i,oCurrentRock.dx + ", " + oCurrentRock.dy + ", " + oCurrentRock.id);
}
}
}

function fnRecordScore(oRock) {
iScore+=parseInt(oRock.id.substring(5,6))*20;
oScore.innerHTML="Score: " + iScore;
}
function fnReincarnate(){
oShip.status="inactive";
oShip.style.display="none";
bShipMoved=false;
oShip.dx=0;
oShip.dy=0;
oShip.style.left=parseInt(iGameBoardWidth/2);
oShip.style.top=parseInt(iGameBoardHeight/2);
iGuys--;
if(iGuys>0){
oWedges.innerHTML="Ships: " + iGuys;
fnSetLog("Pause","Waiting for ship reincarnation");
window.setTimeout("fnEnableShip()",1000);
}
else{
bGameOver=true;
document.body.onkeypress=fnPreKeyHandler;
oIntro.innerHTML="G A M E  O V E R<P>Press any key to player another game.";
oIntro.style.display="block";
}
}

function fnShowLog(){
if(oScratch.status=="closed"){
oScratch.status="open";
oScratch.style.display="block";
oShowLog.value="Hide Script Log";
oShowLog.blur();
}
else{
oScratch.status="closed";
oScratch.style.display="none";
oShowLog.value="Show Script Log";
oShowLog.blur();
}
}
function fnDetermineGameOver(){
if(iActiveRocks<=0){
window.clearInterval(iGameTimerID);
iStartRockCount++;
iLevel++;
iRockCount=0;
oLevel.innerHTML="Level: " + iLevel;
fnInit();
}
}
function fnReInit(){
window.clearInterval(iGameTimerID);
iRockCount=0;
fnInit();
}

function fnEnableCheat(){
iLaserRange=25;
iTotalLasers=12;
alert("Bonus laser power granted. (level must be restarted)");
fnReInit();
}

function fnEnableShip(){
oShip.status="active"
oShip.style.display="block";
}
/* BONUS COMMANDS */

function fnShield(){
if(oShip.shields=="inactive"){
oShip.shields="active";
//oShip.style.border="1 solid";
//oShip.style.borderColor="white";
oShield.style.filter="alpha(opacity=50)";
oShield.style.top=oShip.style.top;
oShield.style.left=oShip.style.left;
oShield.style.display="block";
return false;
}
if(oShip.shields=="active"){
oShip.shields="inactive";
//oShip.style.border="0";
oShield.style.display="none";
return false;
}
}
</script>
