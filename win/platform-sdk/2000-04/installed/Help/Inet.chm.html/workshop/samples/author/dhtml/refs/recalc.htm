<script>
function fnOnlyNumbers(){
window.status=event.keyCode;
if((event.keyCode-48>=0)&&(event.keyCode-48<=9)){
event.returnValue=true;
}
else{
event.returnValue=false;
}
}
</script>

<H1>Scripting recalc and setExpression Sample</H1>
<!--DYNAMIC PROPERTIES SAMPLE CODE BEGINS HERE-->
<INPUT onkeypress="fnOnlyNumbers()" TYPE=text ID="Box1" value=40>The sum of the values in these two text boxes determines the width
<BR><INPUT onkeypress="fnOnlyNumbers()" TYPE=text ID="Box2" value=40>of the blue text box below.
<BR><INPUT TYPE=text ID="Box3" STYLE="background-color:blue">

<BR><BR><BR>
<HR>
<CENTER>
[to view the source code, right-click anywhere in the window]
</CENTER>

<SCRIPT>
//<!--
Box3.style.setExpression("width","eval(Box2.value) + eval(Box1.value)","javascript");
//-->
