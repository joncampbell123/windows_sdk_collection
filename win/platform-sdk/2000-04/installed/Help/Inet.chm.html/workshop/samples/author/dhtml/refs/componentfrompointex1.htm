<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.0 Transitional//EN">
<HTML>
<HEAD>
<TITLE>Example of componentFromPoint Method</TITLE>
<META HTTP-EQUIV="Content-Type" CONTENT="text/html; CHARSET=iso-8859-1">
<META NAME="AUTHOR" CONTENT="InetSDK">
<META NAME="MS.LOCALE" CONTENT="EN-US">

<STYLE>
BODY  {  font-family:sans-serif; font-size:12pt; font-weight:bold;  }
</STYLE>
<SCRIPT>
function trackScroll()
{
var sElem = "";
sElem = document.body.componentFromPoint(event.clientX, event.clientY);
window.status = "mousemove " + event.clientX + ", " + event.clientY +
                " The mouse pointer is hovering over: " + sElem;
}
</SCRIPT>

<!-- SAMPLE_STYLE_START -->
<LINK REL="stylesheet" href="../../../../../workshop/basicsdkie4.css" 
TYPE="text/css">
<!-- SAMPLE_STYLE_END -->
</HEAD>
<!--TOOLBAR_START-->
<!--TOOLBAR_EXEMPT-->
<!--TOOLBAR_END-->

<BODY onmousemove="trackScroll()" TOPMARGIN=0 LEFTMARGIN=0 BGPROPERTIES="FIXED" BGCOLOR="#FFFFFF" 
LINK="#000000" VLINK="#808080" ALINK="#000000">
<BLOCKQUOTE CLASS="body">

<P>Hover the mouse pointer over any scroll bar. See the window status field for
   information about the coordinates of the pointer in the client and which scroll bar
   component the mouse is over.</P>
<BR>
<TEXTAREA COLS=500 ROWS=500>This text area forces scroll bars to appear on the window.</TEXTAREA>
