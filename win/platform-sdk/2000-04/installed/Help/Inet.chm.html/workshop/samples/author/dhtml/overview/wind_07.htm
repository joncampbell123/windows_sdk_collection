<HEAD><TITLE>Search For</TITLE>
<SCRIPT LANGUAGE="JScript">
<!--
function doInit() {
    if (window.dialogArguments != null) {
        window.MySearch.value = window.dialogArguments.str;
        window.MatchCase.checked = window.dialogArguments.caseSensitive;
    }
    window.MySearch.focus();
    window.returnValue = false;
}
function doOK() {
    window.returnValue = true;
    if (window.dialogArguments != null) {
        window.dialogArguments.str = window.MySearch.value;
        window.dialogArguments.caseSensitive = 
            window.MatchCase.checked;
    }
    window.close();
}
function doCancel() {
    window.returnValue = false;
    window.close();
}
-->
</SCRIPT>
<META HTTP-EQUIV="Content-Type" CONTENT="text/html; CHARSET=iso-8859-1">

<BODY onload="doInit()" TOPMARGIN=0 LEFTMARGIN=0 BGPROPERTIES="FIXED" BGCOLOR="#FFFFFF" LINK="#000000" VLINK="#808080" ALINK="#000000">
<BLOCKQUOTE CLASS="body">

<INPUT ID="MatchCase" TYPE=checkbox>&nbsp;<B>Match Case</B> 
<P><B>Search For:</B> <INPUT ID=MySearch TYPE=text></P>
<CENTER>
<BUTTON onclick="doOK()">OK</BUTTON>&nbsp;
<BUTTON onclick="doCancel()">Cancel</BUTTON>
</CENTER>
