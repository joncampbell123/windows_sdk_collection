<!-- HERE WE USE IN-LINE SCRIPTING TO CATCH MOUSE EVENTS -->

<BLOCKQUOTE><P STYLE="font-size:14" onmouseover="this.style.textAlign='center'"
onclick="this.style.textAlign='right'" ondblclick="this.style.textAlign='justify'">
Run your mouse over me to <BR> center the text.<BR> 
Click to make me align to the right.<BR>
Double-click to justify me.
</P></BLOCKQUOTE>
