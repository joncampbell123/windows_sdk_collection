<STYLE>
@media all {
   IE\:HOMEPAGE {behavior:url(#default#homepage)}
}
</STYLE>
<SCRIPT>

/*
The navigateHomePage method redirects the browser to the
client's specified home page URL.
*/


function fnGo(){
oHomePage.navigateHomePage();
event.returnValue=false;
}

</SCRIPT>

<P>
This sample will demonstrate the use of the <B>navigateHomePage</B> method.

<P>
<input type=button value="Go!" onclick="fnGo()"> Navigate to your homepage.
