<!-- USING IN-LINE SCRIPTING TO HANDLE MOUSE EVENTS -->

<DIV STYLE="font-size:14" onmouseover="this.style.textIndent='2cm'"
onclick="this.style.textIndent='50%'" ondblclick="this.style.textIndent=''">
<BLOCKQUOTE>
Run your mouse over me to indent 5cm. Click me to indent 50 percent. Double-click me for no indent.</BLOCKQUOTE>
</DIV>
