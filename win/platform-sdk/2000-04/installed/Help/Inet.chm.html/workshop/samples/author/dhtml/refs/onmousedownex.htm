<TITLE>Example of the onmousedown Event</TITLE>
<META HTTP-EQUIV="Content-Type" CONTENT="text/html; CHARSET=iso-8859-1">
<META NAME="AUTHOR" CONTENT="InetSDK">
<META NAME="MS.LOCALE" CONTENT="EN-US">

<STYLE>
BODY  { font-family:sans-serif }
TABLE  { color:purple; }
</STYLE>

<!-- SAMPLE_STYLE_START -->
<LINK REL="stylesheet" href="../../../../../workshop/basicsdkie4.css" 
TYPE="text/css">
<!-- SAMPLE_STYLE_END -->
</HEAD>
<!--TOOLBAR_START-->
<!--TOOLBAR_EXEMPT-->
<!--TOOLBAR_END-->

<BODY onmousedown="alert(event.srcElement.tagName)" TOPMARGIN=0 LEFTMARGIN=0 BGPROPERTIES="FIXED" BGCOLOR="#FFFFFF" 
LINK="#000000" VLINK="#808080" ALINK="#000000">
<BLOCKQUOTE CLASS="body">

<TABLE BORDER=1>
<TR><TH>Click on the items below with your mouse pointer.</TH></TR>
<TR><TD><BUTTON>Click Me</BUTTON></TD></TR>
<TR><TD><INPUT TYPE=text VALUE="Click Me"></TD></TR>
<TR><TD><SPAN>Click Me</SPAN></TD></TR>
</TABLE>
<P>This document uses event bubbling to capture<BR>the <B>onmousedown</B> event at the <B>BODY</B> element level.</P>
