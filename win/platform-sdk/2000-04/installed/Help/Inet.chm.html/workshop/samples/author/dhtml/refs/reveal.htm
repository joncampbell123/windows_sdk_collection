<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.0 Transitional//EN">
<HTML>
<HEAD>
<TITLE>Reveal Transition Sample</TITLE>

<META NAME="AUTHOR" CONTENT="InetSDK">
<META HTTP-EQUIV="Content-Type" CONTENT="text/html; CHARSET=iso-8859-1">
<META NAME="MS.LOCALE" CONTENT="EN-US">

<SCRIPT>
//<!--
function go() {
    C1.filters[0].Apply();

if (C1.style.visibility == "visible") {
        C1.style.visibility = "hidden";
C1.filters.revealTrans.transition=2;
    }
    else {
        C1.style.visibility = "visible";
C1.filters[0].transition=3;
    }
    C1.filters[0].Play();
}
//-->
</SCRIPT>

<!-- SAMPLE_STYLE_START -->
<LINK REL="stylesheet" href="../../../../../workshop/basicsdkie4.css" TYPE="text/css">
<!-- SAMPLE_STYLE_END -->
</HEAD>
<!-- TOOLBAR_START -->
<!-- TOOLBAR_EXEMPT -->
<!--TOOLBAR_END-->

<BODY TOPMARGIN=0 LEFTMARGIN=0 BGPROPERTIES="FIXED" BGCOLOR="#FFFFFF" 
LINK="#000000" VLINK="#808080" ALINK="#000000">
<BLOCKQUOTE CLASS="body">

<!-- CONTENTS_START -->
<H1>Reveal Transition Sample</H1>
<INPUT TYPE=BUTTON VALUE="Play Transition" onClick="go();"></INPUT>
<span ID=C1 Style="position:absolute;Visibility:visible;Filter:revealTrans(duration=2, transition=3);width:300;height:300;background-color: lightgreen">
<CENTER>
<DIV style="background-color=red;height=100;width:100;position:relative;top:100"></DIV>
</CENTER>
</span>
<!-- CONTENTS_END -->

<DIV STYLE="position:absolute;top:400;LEFT:10">

</DIV>
</BLOCKQUOTE>
</BODY>
</HTML>
