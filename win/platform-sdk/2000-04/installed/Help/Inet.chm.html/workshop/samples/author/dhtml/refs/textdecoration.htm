<!-- USING IN-LINE SCRIPTING TO HANDLE MOUSE EVENTS FOR textDecoration: -->

<SPAN STYLE="font-size:14" onmouseover="this.style.textDecoration='underline'"
onclick="this.style.textDecoration='overline'"
ondblclick="this.style.textDecoration='line-through'">

Run your mouse over me to <BR> underline.<BR> Click me to overline.<BR> Double-click me to line-through.
</SPAN>
</P>
