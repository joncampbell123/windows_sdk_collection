    <PARAM NAME="FieldDelim" VALUE="|">

<BODY TOPMARGIN=0 LEFTMARGIN=0 BGCOLOR="#6699FF" LINK="#000066" VLINK="#666666" TEXT="#000000">
<!--TOOLBAR_START-->
<!--TOOLBAR_EXEMPT-->
<!--TOOLBAR_END-->
<h3 id=Status></h3>
<div id=TheStory datasrc=#content datafld="Story" dataformatas="HTML" style="width: 100%; height: 60%;"></div>

<SCRIPT language=JScript>
var rs;
var tid;
tid = 1;

function goForward() {
  TheStory.style.filter = "revealTrans(duration=2, transition="+tid+")";
  TheStory.filters.revealTrans.Apply();
  if (rs.absolutePosition != rs.recordCount) {
     rs.MoveNext();
   } else {
     rs.MoveFirst();
  }
  TheStory.filters.revealTrans.Play();
  Status.innerHTML = "Showing Story "+rs.absolutePosition+" of "+rs.recordCount;
  tid++;
  if (tid > 23) tid = 1;
  window.setTimeout("goForward()", 5000);
}  

function initialize() {
  rs=Content.recordset;
  Status.innerHTML = "Showing Story "+rs.absolutePosition+" of "+rs.recordCount;
  window.setTimeout("goForward()", 5000);
}

window.onload = initialize;

</SCRIPT>
