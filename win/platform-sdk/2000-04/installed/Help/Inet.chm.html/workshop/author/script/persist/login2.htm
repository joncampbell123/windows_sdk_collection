<HTML>
<HEAD>
<TITLE>Discardable Browser Property Logon Sample -- page 2</TITLE>

<SCRIPT FOR=window EVENT=onload LANGUAGE=JAVASCRIPT>
var bLogon = oCacher.RetrieveCachedData("Login");

if (bLogon != 1) {

// they havn't logged on in this browser window, ask them to please logon 
bLogon = showModalDialog("logon3.htm", null, "dialogWidth:250px; dialogHeight:260px");
oCacher.CacheData("Login", bLogon, 2);
yayOrnay.innerHTML = bLogon ? "Login successful!" : "Login unsuccessful.";
}
else {

yayOrnay.innerHTML = "Yay! You didn't have to logon again did you?";
}
</SCRIPT>

</HEAD>
