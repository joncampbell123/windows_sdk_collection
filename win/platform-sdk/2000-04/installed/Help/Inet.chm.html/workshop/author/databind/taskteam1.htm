<SCRIPT>
function search()
{
  realSearch();
}

function realSearch()
{

    Tasks.style.display = "";

    targetTeamID = teamID.options(teamID.selectedIndex).value;

    if (targetTeamID != 0) {
      DSC1.filter = "team = "+targetTeamID;
    } else {
      DSC1.filter = "";
    }
    DSC1.Reset();

    status = "Done";
}
</SCRIPT>
<FONT FACE="VERDANA, ARIAL, HELVETICA" SIZE=2>
<h1><A NAME="TOP" IDX_CONCEPT="stopindex">Tasklist -- Search by Team</A></h1>
<P>

</P>

<INPUT TYPE=BUTTON VALUE="Search" onclick="search()">
