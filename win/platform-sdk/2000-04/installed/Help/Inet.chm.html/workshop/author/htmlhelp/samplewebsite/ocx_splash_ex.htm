<h1>Splash command example</h1>

<p>This page demonstrates the use of the <b>Splash</b> command. The timeout for this splash screen is set for 5 seconds. Click the image to dismiss the splash window before the allotted time.</p>

<OBJECT id=splash type="application/x-oleobject"
        classid="clsid:adb880a6-d8ff-11cf-9377-00aa003b7a11"

>
    <PARAM name="Command" value="Splash">
    <PARAM name="Item1" value="splash.gif">
    <PARAM name="Item2" value="5000">
    <PARAM name="Item3" value="splash.jpg">
</OBJECT>
