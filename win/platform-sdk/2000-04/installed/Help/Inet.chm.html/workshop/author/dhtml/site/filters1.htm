<TITLE>Filters</TITLE>

<!--This style block sets the classes for all the filters and styles for all H1 and TD tags-->
<STYLE TYPE="text/CSS">
.glow {position:relative; top:0; left:0; width:100; height:100; filter:glow(color=#483D8B,strength=5)}
.blur {position:relative; top:0; left:0; width:100; height:100; color:#483D8B; filter:blur(Add=0, Direction=45,strength=5)}
.invert {position:relative; top:0; left:0; width:100; height:100; color:#483D8B; filter:invert}
.shadow {position:relative; top:0; left:0; width:100; height:100; filter:shadow(color=#483D8B,direction=135)}
.dropshadow {position:relative; top:0; left:0; width:100; height:100; filter:dropshadow(color=#483D8B,OffX=3,OffY=3,Positive=1)}
.gray {position:relative; top:0; left:0; width:100; height:100; color:#483D8B; filter:gray}
.wave {position:relative; top:0; left:0; width:100; height:100; filter:wave(Add=0,Freq=4,LightStrength=10,Phase=25,Strength=5)}
.mask {position:relative; top:0; left:0; width:100; height:100; filter:mask(color=#483D8B)}
.chroma {position:relative; top:0; left:0; width:100; height:100; filter:chroma(color=#7384D6)}
.xray {position:relative; top:0; left:0; width:100; height:100; filter:xray}
</STYLE>

<!--This sets the lights on the image-->
<script language=JavaScript>
function setlight()
{
alight1.filters[0].clear();
alight1.filters[0].addcone(0,0,0,60,60,115,132,214,60,50);
}

</SCRIPT>


</HEAD>

<BODY onload="setlight()" TOPMARGIN=0 LEFTMARGIN=0 BGCOLOR="#FFFFFF" LINK="#000066" VLINK="#666666" TEXT="#000000">
