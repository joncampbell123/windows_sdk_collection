<TITLE>Scaling, example 2</TITLE>
<script>
var t=0;

function go() {
t++;
if ( t<=500/10) {
x=window.setTimeout('go()', 100);
scaleImage(10);
moveImage(5);
}
}

function scaleImage(scaleFactor) {
img1.width = img1.width + scaleFactor;
}

function moveImage(moveFactor) {
img1.style.pixelLeft = img1.style.pixelLeft + moveFactor;
}

window.onload = go;
</script>
