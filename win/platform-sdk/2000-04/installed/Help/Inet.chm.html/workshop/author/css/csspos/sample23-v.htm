<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 3.2//EN">
<HTML>

<HEAD>
<TITLE>Sample 23 - VBScript version</TITLE>

<SCRIPT LANGUAGE="VBScript">
<!--

dim TextVisible

Sub StartMove()

TextVisible = 1
action = window.setInterval("MoveText()", 100)
End Sub

Sub MoveText()

if TextVisible = 0 then
MovingText.style.pixelLeft = MovingText.style.pixelLeft + 10
if MovingText.style.pixelLeft = 0 then
TextVisible = 1
end if
        else
MovingText.style.pixelLeft = MovingText.style.pixelLeft - 10
if MovingText.style.pixelLeft = -300 then
TextVisible = 0
end if
end if
End Sub


//-->
</SCRIPT>
</HEAD>

<BODY BGCOLOR=#D3D3D3 onload="StartMove()">

<SPAN ID=MovingText STYLE="position:relative; background-color:#FFB6C1">This text can whiz on and off the page.
<SPAN STYLE="position: relative; background-color:#ADD8E6">This text is a child of the moving red text.</SPAN></SPAN>

</BODY>

</HTML>
