<html>
<body style="font-family: verdana">

<h2>Radio Button Value Check</h2>

<fieldset style="width:100px">
<legend>Milestone</legend>
<INPUT type=radio name=milestone  value="Beta 1">Beta 1<br>
<INPUT type=radio name=milestone checked value="Beta 2">Beta 2<br>
</fieldset>

<br>

<input value="Show Checked" type=button onclick="alert(getRadioValue('milestone'));">

<script language="Jscript">
function getRadioValue(radioName) {
  var collection;
 
  collection = document.all[radioName];

  for (i=0;i<collection.length;i++) {
    if (collection[i].checked)
       return(collection[i].value);
  }
}
</script>
</body>
</html>
