<HTML>
<HEAD>
<META NAME="PRODUCT" CONTENT="Internet Explorer">
<META NAME="MS.LOCALE" CONTENT="EN-US">
<TITLE>Browser alert: Internet Explorer 4.0 required for viewing</TITLE>
<LINK REL="stylesheet" TYPE="text/css" href="infostyle.css">

<SCRIPT language="JavaScript">

function checkBrowser() {
  // Mac string = 4.0 (compatible; MSIE 4.0; Macintosh; I; PPC)
  // Windows NT 4 string = 4.0 (compatible; MSIE 4.01; Windows NT)
  // Win 95 string = 4.0 (compatible; MSIE 4.01; Windows 95)
  // Win16 string = 4.0 (compatible; MSIE 4.0; Windows 3.1)
  yourVersion = navigator.appVersion;
  //versionText.innerText = yourVersion;
  var ie4final = (navigator.appVersion.indexOf('MSIE 4') != -1) || (navigator.appVersion.indexOf('MSIE 5') != -1);
  if (!ie4final) {
    top.location.href = "defaultn.htm"
  }
  else {
    var bType = (navigator.appVersion.indexOf('Macintosh') != -1);
    if (bType) {
      // Mac version.
      top.location.href = "defaultm.htm"
    } else {
      // Verify that browser is running in Win32.
      var win16 = (navigator.appVersion.indexOf('Windows 3.1') != -1);
      if (win16) {
        top.location.href = "defaultn.htm"
      } else {
        top.location.href = "defaultie.htm"
      }
    }
  }
}

</SCRIPT>

</HEAD>
<!--TOOLBAR_START-->
<!--TOOLBAR_EXEMPT-->
<!--TOOLBAR_END-->

<BODY bgcolor="#FFFFFF" onload="checkBrowser();">
<P class=heading>&nbsp;</P>
<P ID=versionText></P>
</BODY>
</HTML>
