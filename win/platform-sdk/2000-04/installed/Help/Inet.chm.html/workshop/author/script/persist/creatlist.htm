<HTML>
<HEAD>
<TITLE>Shopping List - Discardable Browser Property Sample</TITLE>

<!--
This HTML sample demonstrates how the new Internet Explorer 4.0 discardable browser property
works. The user loads up a "shopping cart" with items by selecting them from a list, or entering
unlisted items in a form field. When the user is ready to make the purchase they press the
indicated button, the shopping list items are cached in an array object, and the user's
window is navigated to "The Store" (thestore.htm).
-->


<SCRIPT LANGUAGE=vbscript>
Dim g_fCheck
g_fCheck = False

' Triggered when the user navigates away from the page
function window_onbeforeunload

   ' Regardless of the number of items in the list (possibly none)
   ' write the property to the associative array
   CacheShoppingList

   if g_fCheck = True then ' Set if the user chose to go to the store
      window.event.returnValue = "Shopping list is empty. Are you sure?"
   end if
end function
</SCRIPT>

<!--
 triggered when the user double clicks on an item in the shopping list
 remove the double-clicked item from one list and put it in the other
-->
<SCRIPT FOR=lstPicked EVENT=ondblclick LANGUAGE=JAVASCRIPT>
HandlePicker(this, lstAvailable, false)
</SCRIPT>

<SCRIPT FOR=lstAvailable EVENT=ondblclick LANGUAGE=JAVASCRIPT>
HandlePicker(this, lstPicked, false)
</SCRIPT>

<SCRIPT FOR=window EVENT=onload LANGUAGE=JAVASCRIPT>
// triggered when the user navigates to the page
// auto-populate the shopping list if the data has been cached
var aList = oCacher.RetrieveCachedData("ShoppingCart");
if (aList != null)
{
for (i = 0; i < aList.length; i++)
{
List_AddItem(lstPicked, aList[i]);
}
}

var oRS = tdcAcmeItems.recordset;
</SCRIPT>

<SCRIPT FOR=tdcAcmeItems EVENT=ondatasetchanged LANGUAGE=JAVASCRIPT>
// Fill the list of available items with data from the database
var oRS = this.recordset;
oRS.MoveFirst();

var aList = oCacher.RetrieveCachedData("ShoppingCart");
var cItem;

for (nIndex = 0; nIndex < oRS.recordCount; nIndex++)
{
cItem = oRS.fields("item").value
// Don't add the item if it's in the picked list
if (!FindItem(cItem, aList))
{
List_AddItem(lstAvailable, cItem)
}
oRS.MoveNext();
}
</SCRIPT>

<SCRIPT LANGUAGE=JAVASCRIPT>
// Set a flag if the list is empty, and
// navigate to the store page
function CheckListAndGo()
{
   g_fCheck = (lstPicked.length == 0 ? true : false);
   location.href="thestore.htm"
}

// Populate an array with the picked items and cache the array
// in the Web Browser's associative array
function CacheShoppingList()
{
   aList = new Array();
   for (i = 0; i < lstPicked.length; i++)
   {
      aList[i] = lstPicked.options(i).text;
   }
   // cache the data, make it secure to the vroot
   oCacher.CacheData("ShoppingCart", aList, 2);
}

function List_AddItem(oList, cItem)
{
if (oList == null)
{
return false;
}

// BUGBUG: This doesn't handle an empty string composed of spaces
if (cItem == '')
{
return;
}

oOption = document.createElement('OPTION');
oOption.value = oList.options.length+1;
oOption.text = cItem;
oList.add(oOption)
}

// Remove the specified item from the list
// 
// Parameters
//    oList - object reference to list from which item is to be removed
//    cText - text of item to be removed
//
//    Note: The item may not exist
function List_RemoveItem(oList, cText)
{
alert("Searching for " + cText);
for (i = 0; i < oList.length; i++)
{
if (cText == oList.options(oList.selectedIndex).text)
{
oList.remove(i);
}
}
}

// Find cItem in the array aList
// 
// Parameters
//    cItem - item to search for
//    aList - array to be searched
//
function FindItem(cItem, aList)
{
if (aList == null)
{
return false;
}

var nIndex;
for (nIndex = 0; nIndex < aList.length; nIndex++)
{
if (cItem == aList[nIndex])
{
return true;
}
}
return false;
}


// Handle interaction with the shopping item picker
// 
// Parameters
//    oSource - object reference to source of selected item(s)
//    oDest   - object reference to destination of selected item(s)
//    fAll    - boolean. true if all items should be moved from source to dest
function HandlePicker(oSource, oDest, fAll)
{
var cText;

if (fAll)
{
var nIndex;
while (oSource.length > 0)
{
cText = oSource.options(0).text
oSource.remove(0);
List_AddItem(oDest, cText)
}
}
else
{
if (oSource.selectedIndex >= 0)
{
cText = oSource.options(oSource.selectedIndex).text
oSource.remove(oSource.selectedIndex);
List_AddItem(oDest, cText)
}
}
}
</SCRIPT>
</HEAD>

<OBJECT CLASSID="clsid:333C7BC4-460F-11D0-BC04-0080C7055A83" HEIGHT=0 WIDTH=0 ID=tdcAcmeItems>
   <PARAM NAME="DataURL" VALUE="acmeitem.csv">
   <PARAM NAME="UseHeader" VALUE="True">
</OBJECT>


<H1><A NAME="TOP" IDX_CONCEPT="stopindex">Shopping List</A></H1>
<P>Enter an item, and add it to the shopping list.
<P>Item 
<INPUT TYPE=TEXT ID=txtItem>
<INPUT TYPE=BUTTON ACCESSKEY=A VALUE=Add onclick="javascript:List_AddItem(lstPicked, txtItem.value)">
<TABLE>
<TR><TD>Available Items</TD><TD>&nbsp;</TD><TD>Picked Items</TD></TR>

<TR>
<TD>
<SELECT ID=lstAvailable SIZE=10 STYLE="width:200"></TD>
</SELECT>
</TD>

<TD>
<BUTTON onclick="javascript:HandlePicker(lstAvailable, lstPicked, true)"><SPAN STYLE="width:15">&gt;&gt;</SPAN></BUTTON>
<BR><BUTTON onclick="javascript:HandlePicker(lstAvailable, lstPicked, false)"><SPAN STYLE="width:15">&gt;</SPAN></BUTTON>
<BR><BUTTON onclick="javascript:HandlePicker(lstPicked, lstAvailable, false)"><SPAN STYLE="width:15">&lt;</SPAN></BUTTON>
<BR><BUTTON onclick="javascript:HandlePicker(lstPicked, lstAvailable, true)"><SPAN STYLE="width:15">&lt;&lt;</SPAN></BUTTON>
</TD>

<TD>
<SELECT ID=lstPicked SIZE=10 STYLE="width:200"></TD>
</SELECT>
</TD>
</TR>
</TABLE>
<P><BUTTON VALUE="Go to the Store" onclick="CheckListAndGo()">Go to Store</BUTTON>
</BODY>
</HTML>
