
<head>
<title>Simple Printing</title>
<LINK REL="STYLESHEET" href="/sitebuilder/shared/globalcss/sbnie4.css">
<script defer language=JScript src="print.js"></script>
</head>

<body onbeforeprint="beforeprint()" onafterprint="afterprint()" bgcolor="infobackground">
<p><input disabled name="idPrint" type="button" value="Print this page"
onclick="print()"> </p>
</body>

<script defer>
function window.onload() {
  idPrint.disabled = false;
}

var originalTitle;
function beforeprint() {
  idPrint.disabled = true;
  originalTitle = document.title;
  document.title = originalTitle + " - by Captain"
}

function afterprint() {
  document.title = originalTitle;
  idPrint.disabled = false;
}
</script>
