<html>
<head><TITLE>Web Workshop - Order entry form example</title></head>
<body><script language="javascript">
if (window.name != "content")
    document.write("<center><a href='../../../index.html?page=workshop/essentials/versions/order_entry.htm'>show framing</a></center>")
</script>

<script>

function lookup() {

  var e, mp, prodNum, md, mdesc, mu, mucost; 

e = event.srcElement;

while (e.tagName != "TR")
  e  = e.parentElement;

mp = e.children.p;

l = mp.children.length;

mprodNum = mp.children.prodNum;

md = e.children.d;
mdesc = md.children.desc;

mu = e.children.u;
mucost = mu.children.ucost;

if (mprodNum.value == "1234")
{
  mdesc.innerText = "  Wendell's Widgets Gadget Organizer";
  mucost.innerText = "470";
// buck1.style.display = "";
}

if (mprodNum.value == "5678")
{
  mdesc.innerText = "  Wendell's Widgets Gadget Destructor";
  mucost.innerText = "500";
//  buck1.style.display = "";
}

}

function updateCost() {

  var e, mu, mucost, mq, mqty, mt, mtcost;

e = event.srcElement;
while (e.tagName != "TR") 
e = e.parentElement;

mu = e.children.u;
mucost = mu.children.ucost;

mq = e.children.q;
mqty = mq.children.qty;

mt = e.children.t;
mtcost = mt.children.tcost;

  mtcost.innerText = mqty.value * mucost.innerText;
//  buck2.style.display = "";

}


function newRow() {

  var r, p, pi, d, ds, u, us, q, qi, t, ts;

//  r = TheRow.cloneNode(true);

  r = document.createElement("TR");

  p = document.createElement("TD");
  p.id = "p";
  pi = document.createElement("INPUT");
  pi.type = "text";
  pi.id = "prodNum";
  pi.onblur = lookup;
  p.insertBefore(pi, null);


  d = document.createElement("TD");
  d.id = "d";
  ds = document.createElement("SPAN");
  ds.id = "desc";
  d.insertBefore(ds, null);

  u = document.createElement("TD");
  u.id = "u";
  us = document.createElement("SPAN");
  us.id = "ucost";
  u.insertBefore(us, null);


  q = document.createElement("TD");
  q.id = "q";
  qi = document.createElement("INPUT");
  qi.type = "text";
  qi.id = "qty";
  qi.onblur = myonblur;
  q.insertBefore(qi, null);

  t = document.createElement("TD");
  t.id = "t";
  ts = document.createElement("SPAN");
  ts.id = "tcost";
  t.insertBefore(ts, null);

     
  r.insertBefore(p,null);
  r.insertBefore(d,null);
  r.insertBefore(u,null);
  r.insertBefore(q,null);
  r.insertBefore(t,null);

  TBody.insertBefore(r, null);
}

function myonblur() {
 
  updateCost();
  newRow();

}
</script>

<table id=TheTable border=1>
<thead>
<tr>
<td width=120>Product Number</td>
<td width=200>Description</td>
<td width=70>Unit Cost</td>
<td width=100>Quantity</td>
<td width=100>Total Cost</td>
</tr>
</thead>
<tbody id=TBody>
<tr id=TheRow>
<td id=p><input type=text id=prodNum width=100% onblur="lookup();"></td>
<td id=d><span id=desc></span></td>
<td id=u><span id=buck1 style="display:none">$</span><span id=ucost></span></td>
<td id=q><input type=text id=qty width=100%  onblur="myonblur();" ></td>
<td id=t><span id=buck2 style="display:none">$</span><span id=tcost></td>
</tr>
</tbody>
</table>
</body>
</html>
