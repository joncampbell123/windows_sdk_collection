<HTML>
<script>
function insertionSort(t, iRowStart, iRowEnd, fReverse)
{
    var iRowInsertRow, iRowWalkRow;
    for ( iRowInsert = iRowStart + 1 ; iRowInsert <= iRowEnd ; iRowInsert++ )
    {
        textRowInsert = t.children[iRowInsert].innerText;

        for ( iRowWalk = iRowStart ; iRowWalk <= iRowInsert ; iRowWalk++ )
        {
            textRowCurrent = t.children[iRowWalk].innerText;

            if ( (   (!fReverse && textRowInsert <= textRowCurrent)
                 || ( fReverse && textRowInsert >= textRowCurrent) )
                 && (iRowInsert != iRowWalk) )
            {
                eRowInsert = t.children[iRowInsert];
                eRowWalk = t.children[iRowWalk];
                t.insertBefore(eRowInsert, eRowWalk);
                iRowWalk = iRowInsert; // done
            }
        }
    }
}

</script>
<body style="font-family: verdana; font-size: 20">

<h2>Sorting your Comic Book Collection with the DOM</h2>

<br>
<input type=button value="Sort By Comic Title" onclick="insertionSort(Table1.children[0], 0, Table1.rows.length - 1, false)">

<br><br>

<table id=Table1 border=1 >
  <tr><td>Spectacular Spider Man</td><td>Issue #1</td><td>Good</td></tr>
  <tr><td>Amazing Spider Man</td><td>Issue #1</td><td>Good</td></tr>

  <tr><td>Generation 13</td><td>Issue #13</td><td>Very Good</td></tr>
  <tr><td>Spawn</td><td>Issue #5</td><td>Excellent</td></tr>
  <tr><td>Pinky & the Brain</td><td>Issue #4</td><td>Poor</td></tr>
</table>

</BODY>
</HTML>
