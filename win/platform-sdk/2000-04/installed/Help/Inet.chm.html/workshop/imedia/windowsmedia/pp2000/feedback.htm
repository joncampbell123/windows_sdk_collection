<html>

<head>
<base target="contents">
<meta NAME="VERSION" CONTENT="9.0.0.2504">

<title></title>
<style type="text/css">
<!--
@import url(style.css);
-->
</style>
<script LANGUAGE="javascript" src="global.js">

<script LANGUAGE="javascript" for="window" event=onload> {
HILITE_COLOR = "Orange";
document.title = FEATURE_TITLE;
document.all.HelpButton.title = HELP_BUTTON_TITLE;
document.all.ViewPreviousButton.title = VIEW_PREVIOUS_BUTTON_TITLE;
document.all.ChatButton.title = ONLINE_CHAT_BUTTON_TITLE;
document.all.EmailButton.title = EMAIL_FEEDBACK_BUTTON_TITLE;

document.all.EmailButton.innerText = EMAIL_BUTTON_LABEL;
document.all.ChatButton.innerText = CHAT_BUTTON_LABEL;
document.all.ViewPreviousButton.innerText = VIEW_SLIDES_BUTTON_LABEL;
document.all.HelpButton.innerText = HELP_BUTTON_LABEL;

VIEW_PREVIOUS = "previous.htm"

if (CHAT_URL !="") {
  document.all.ChatButtonCell.style.display = "block"
  }
else  {
  document.all.ChatButtonCell.style.display = "none";
}

if (EMAIL !="") {
  document.all.EmailButtonCell.style.display = "block"
  }
else {
  document.all.EmailButtonCell.style.display = "none";
 }
}
</script>

</head>

<body bgcolor="#000000" text="#FFFFFF" topmargin="2" leftmargin="2">


<table style="position:relative; top:0" align="right" border=0 cellpadding=0 cellspacing=0 >
<tr>
<td id="HelpButtonCell">
<div dataformatas="HTML"  id="HelpButton" class="feedbackbutton"
STYLE="position:relative;padding-top:1; border-right:none; top:0"
onmouseover="HelpButton.style.color = HILITE_COLOR"
onmouseout="HelpButton.style.color = 'White'"
onclick="var newhelpwin=window.open(HELP_URL, 'help_window', 'toolbar=0, location=0, directories=0, status=yes, menubar=0, resizable=0, width=550, height=400, top=0, left=0');">
</div>
</td>
</tr>
</table>


<table style="position:absolute;top:0;left:0" border=0 cellpadding=0 cellspacing=0 >
<tr>

<td id="ViewPreviousButtonCell" >
<div dataformatas="HTML" align="center" id="ViewPreviousButton" class="feedbackbutton"
STYLE="border-left:none;left: 0; top:0;"
onmouseover="ViewPreviousButton.style.color = HILITE_COLOR"
onmouseout="ViewPreviousButton.style.color = 'White'"
onclick="var newslideswin=window.open(VIEW_PREVIOUS, 'slides_window', 'toolbar=0, location=0, directories=0, status=yes, menubar=0, resizable=1, width=700, height=400, top=5, left=5')">

</div>
</td>
<td  id="EmailButtonCell" >
<div dataformatas="HTML" align="center" id="EmailButton" class="feedbackbutton" 
STYLE="border-left:none; left: 150; top:0;"
onmouseover="EmailButton.style.color = HILITE_COLOR"
onmouseout="EmailButton.style.color = 'White'"
onclick="location.href='mailto:' + EMAIL +'?Subject='+ EVENT_TITLE;">

</div>
</td>
<td id="ChatButtonCell" >
<div dataformatas="HTML" align="center" id="ChatButton" class="feedbackbutton"
STYLE="border-left:none;  left: 260; top:0;"
onmouseover="ChatButton.style.color = HILITE_COLOR"
onmouseout="ChatButton.style.color = 'White'"
onclick="location.href = chat_url;">

</div>
</td>
</tr>
</table>

</body>
</html>
