<INPUT ID=ToggleButton TYPE=button VALUE="Pause" STYLE="POSITION:absolute; LEFT:200; TOP:300" onClick="TogglePlay()">
<INPUT ID=ResetButton TYPE=button VALUE="Reset" STYLE="POSITION:absolute; LEFT:300; TOP:300" onClick="Reset()">

<OBJECT ID=seq
CLASSID="CLSID:B0A6BAE2-AAF0-11d0-A152-00A0C908DB96">
</OBJECT>

<SCRIPT LANGUAGE="VBScript">

dim SecTen
dim MinOne
dim MinTen

Sub seq_OnInit

SecTen = 0
MinOne = 0
MinTen = 0

call seq("ActionSet1").At(0.0, "DrawNum(sgSecOne, 0)", 1)
call seq("ActionSet1").At(1.0, "DrawNum(sgSecOne, 1)", 1)
call seq("ActionSet1").At(2.0, "DrawNum(sgSecOne, 2)", 1)
call seq("ActionSet1").At(3.0, "DrawNum(sgSecOne, 3)", 1)
call seq("ActionSet1").At(4.0, "DrawNum(sgSecOne, 4)", 1)
call seq("ActionSet1").At(5.0, "DrawNum(sgSecOne, 5)", 1)
call seq("ActionSet1").At(6.0, "DrawNum(sgSecOne, 6)", 1)
call seq("ActionSet1").At(7.0, "DrawNum(sgSecOne, 7)", 1)
call seq("ActionSet1").At(8.0, "DrawNum(sgSecOne, 8)", 1)
call seq("ActionSet1").At(9.0, "DrawNum(sgSecOne, 9)", 1)
call seq("ActionSet1").At(10.0, "",1)

call seq("ActionSet1").Play
End Sub

Sub seq_OnStop(ActionSetName)

SecTen = SecTen + 1
If SecTen = 6 Then
SecTen = 0
MinOne = MinOne + 1
If MinOne = 10 Then
MinOne = 0
MinTen = MinTen + 1
If MinTen = 6 Then
MinTen = 0
End If
DrawNum sgMinTen, MinTen
End If
DrawNum sgMinOne, MinOne
End If
DrawNum sgSecTen, SecTen

call seq("ActionSet1").Play
End Sub

Sub DrawNum(ClockNum, Num)

Select Case Num

Case 0
ClockNum.SourceURL = "0.txt"
Case 1
ClockNum.SourceURL = "1.txt"
Case 2
ClockNum.SourceURL = "2.txt"
Case 3
ClockNum.SourceURL = "3.txt"
Case 4
ClockNum.SourceURL = "4.txt"
Case 5
ClockNum.SourceURL = "5.txt"
Case 6
ClockNum.SourceURL = "6.txt"
Case 7
ClockNum.SourceURL = "7.txt"
Case 8
ClockNum.SourceURL = "8.txt"
Case 9
ClockNum.SourceURL = "9.txt"
End Select
End Sub

Sub Reset
SecTen = 0
MinOne = 0
MinTen = 0
DrawNum sgMinTen, 0
DrawNum sgMinOne, 0
DrawNum sgSecTen, 0
DrawNum sgSecOne, 0
call seq("ActionSet1").Seek(0.0)
End Sub

Sub TogglePlay
If seq("ActionSet1").PlayState = 1 Then
ToggleButton.value = "Resume"
call seq("ActionSet1").Pause
Else
ToggleButton.value = "Pause"
call seq("ActionSet1").Play
End If
End Sub

Sub window_OnUnload
call seq("ActionSet1").Stop
End Sub

</SCRIPT>
