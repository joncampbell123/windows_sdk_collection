<SCRIPT language=JScript>
var rs;

function goForward() {
  if (rs.absolutePosition != rs.recordCount) {
     rs.MoveNext();
   } else {
     rs.MoveFirst();
  }
  Status.innerHTML = rs.absolutePosition+" of "+rs.recordCount;
}  

function initialize() {
  rs=Content.recordset;
  Status.innerHTML = rs.absolutePosition+" of "+rs.recordCount;
}

window.onload = initialize;

</SCRIPT>
