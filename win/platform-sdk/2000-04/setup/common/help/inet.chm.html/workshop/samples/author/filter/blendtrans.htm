<!--
function fadeOut(obj) {
    obj.style.filter="blendTrans(duration=2)";
// make sure filter is not already playing
if ((obj.visibility != "hidden") && (obj.filters.blendTrans.status != 2)) {
        obj.filters.blendTrans.Apply();
        obj.style.visibility="hidden";
    obj.filters.blendTrans.Play();
}
}
function fadeIn(obj) {
    obj.style.filter="blendTrans(duration=2)";
// make sure filter is not already playing
if ((obj.visibility != "visible") && (obj.filters.blendTrans.status != 2)) {
      obj.filters.blendTrans.Apply();
      obj.style.visibility="visible";
  obj.filters.blendTrans.Play();
}
}
-->

<H1>blendTrans Filter Example</H1>
<P>Click the blue buttons below to fade the following text in and out:</P>
<DIV ID="oDiv" STYLE="width:250; color:#CC00CC">This text can be faded in and out.</DIV>
<P>
<BUTTON onclick="fadeOut(oDiv)" STYLE="background-color: blue; color: white">Fade Text Out</BUTTON>&nbsp;
<BUTTON onclick="fadeIn(oDiv)" STYLE="background-color: blue; color: white">Fade Text In</BUTTON>
</P>
<P>Click the red buttons below to fade the following image in and out:</P>
<IMG ID="oImg" src="../../../../workshop/graphics/sphere.jpg"></IMG>
<P>
<BUTTON onclick="fadeOut(oImg)" STYLE="background-color: red">Fade Image Out</BUTTON>&nbsp;
<BUTTON onclick="fadeIn(oImg)" STYLE="background-color: red">Fade Image In</BUTTON>
</P>
</DIV>
