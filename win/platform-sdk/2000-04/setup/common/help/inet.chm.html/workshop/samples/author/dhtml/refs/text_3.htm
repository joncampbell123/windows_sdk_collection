.special{background-color: #EFEFEF; color: black; font-size: "8pt"; font-family: Arial; border: "1 ridge"; padding: 5px; border-top-color: "#CFCFCF"; border-left-color: "#CFCFCF"; border-right-color: "#505050"; border-bottom-color: "#505050";}

<script>
function fnShow(){
for(var i=0;i<oSel.options.length;i++){
oSel.options[i].text+=" (slugs)";
}
}
function fnFlash(){
var sQuery="";
for(var i=0;i<oSel.options.length;i++){
sQuery+=i + " - Value=" + oSel.options[i].value + " - Text=" + oSel.options[i].text + "\n";
}
alert(sQuery);
}
</script>

<BLOCKQUOTE CLASS="body">

<H1>text Property</H1>
<P>Make a selection from the list to see the <B>value</B> property and the <B>text</B> property.  Click the <b>Show Attractions</b> button to alter the <B>text</B> property for each selection.</P>

<p><select id="oSel" onchange="fnFlash()">
<option value="US">Seattle
<option value="FRANCE">Paris
<option value="MEXICO">Cabo_San_Lucas
</select></P>

<p><input type=button value="Show Attractions" onclick="fnShow()"></p>
