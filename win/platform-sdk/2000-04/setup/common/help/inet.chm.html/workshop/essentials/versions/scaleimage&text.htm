<html>
<head>
<LINK REL="STYLESHEET" href="/sitebuilder/shared/globalcss/sbnie4.css">
<title>Sample: Scaling an image and text</title>
<style>
.myStyle { font-family: georgia; color:#CC9900; font-style:italic }
</style>

<script>
var cr = "\n";
var msg = "";

function change() {
if (document.body.clientWidth > 1 && document.body.clientHeight > 1) {
text1.style.fontSize=document.body.clientHeight*.3 + "px"
img1.style.width=document.body.clientHeight*.45 + "px"
text1.style.left = document.body.clientHeight*.3 + 10
}
}

window.onresize=change
window.onload=change
</script>
</head>


<BODY TOPMARGIN=0 LEFTMARGIN=10 BGCOLOR="#FFFFFF" VLINK="#666666" TEXT="#000000">
<!--TOOLBAR_START-->
<!--TOOLBAR_EXEMPT-->
<!--TOOLBAR_END-->
<H1><A NAME="TOP" IDX_CONCEPT="stopindex">Scaling an Image and Text Based on Browser Size</A></H1>


<img id=img1 style="position:absolute; left:100; top:100; z-index:-1;" src=greece.jpg>
<font class=myStyle id=text1 style="position:absolute; left:100; top:100; z-index:1;">Athens</font>
