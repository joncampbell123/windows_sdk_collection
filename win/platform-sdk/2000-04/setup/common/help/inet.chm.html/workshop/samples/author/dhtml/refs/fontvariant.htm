<!-- HERE WE USE INLINE SCRIPTING TO CHANGE THE fontVariant ON A MOUSE EVENT -->

<DIV onmousedown="this.style.fontVariant='small-caps'"
onmouseup="this.style.fontVariant='normal'">
Click the line this text is on to make the text small caps. This example catches the <B>mouse</B>
event with inline scripting. 
</DIV>
