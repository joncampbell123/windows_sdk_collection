<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.0 Transitional//EN">
<HTML>
<HEAD>
<TITLE>onrepeat</TITLE>
<META HTTP-EQUIV="Content-Type" CONTENT="text/html; CHARSET=iso-8859-1">
<META NAME="AUTHOR" CONTENT="InetSDK">
<META NAME="MS.LOCALE" CONTENT="EN-US">

<!-- SAMPLE_STYLE_START -->
<LINK REL="stylesheet" href="../../../../workshop/basicsdkie4.css" TYPE="text/css">
<!-- SAMPLE_STYLE_END -->
<STYLE>
.time        { behavior: url(#default#time);}
</STYLE>

</HEAD>
<!--TOOLBAR_START-->
<!--TOOLBAR_EXEMPT-->
<!--TOOLBAR_END-->

<BODY TOPMARGIN=0 LEFTMARGIN=0 BGPROPERTIES="FIXED" BGCOLOR="#FFFFFF" 
LINK="#000000" VLINK="#808080" ALINK="#000000">

<BLOCKQUOTE CLASS="body">
<SPAN ID="parent" CLASS=time t:BEGIN="0" t:DUR="6" t:REPEAT="4" t:TIMELINE="par"
    t:TIMEACTION="display" onrepeat="alert('Current iteration: ' +
    window.event.getAttribute('iteration'));">
    <SPAN CLASS=time t:BEGIN="0" t:DUR="2">This text will be displayed for two
    seconds.</SPAN><BR>
    <SPAN CLASS=time t:BEGIN="3" t:DUR="4">This text will be displayed for four
    seconds.</SPAN>
</SPAN>
</BLOCKQUOTE>
</BODY>
</HTML>
