<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 3.2//EN">
<HTML>

<HEAD>
<TITLE>Sample 18 - JavaScript version</TITLE>

<SCRIPT LANGUAGE="JScript">
<!--

function ToggleVisibility() {

if (Olivia1.style.visibility == "hidden") {
VisButton.value = "visibility: visible";
Olivia1.style.visibility = "visible";
}
else {
VisButton.value = "visibility: hidden";
Olivia1.style.visibility = "hidden";
}

}

function ToggleDisplay() {

if (Olivia2.style.display == "none") {
DispButton.value = "display: \"\"";
Olivia2.style.display = "";
}
else {
DispButton.value = "display: none";
Olivia2.style.display = "none";
}

}

//-->
</SCRIPT>
</HEAD>

<BODY BGCOLOR=#D3D3D3>

<INPUT ID=VisButton TYPE=button VALUE="visibility: visible" onClick="ToggleVisibility()">
<p>
Olivia
<p>
<IMG ID=Olivia1 STYLE="width:136px; height:228px; visibility:visible" src=olivia1.gif>
<p>
at 8 weeks

<p><hr><p>

<INPUT ID=DispButton TYPE=button VALUE="display:" onClick="ToggleDisplay()">
<p>
Olivia
<p>
<IMG ID=Olivia2 STYLE="width:136px; height:228px; display:" src=olivia2.gif>
<p>
at 6 months

</BODY>

</HTML>
