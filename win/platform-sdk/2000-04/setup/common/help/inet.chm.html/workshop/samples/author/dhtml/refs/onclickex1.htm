<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.0 Transitional//EN">
<HTML>
<HEAD>
<TITLE>Example of onclick on Grouped Controls</TITLE>
<META HTTP-EQUIV="Content-Type" CONTENT="text/html; CHARSET=iso-8859-1">
<META NAME="AUTHOR" CONTENT="InetSDK">
<META NAME="MS.LOCALE" CONTENT="EN-US">

<SCRIPT>
function CookieGroup() 
{
txtOutput.value = window.event.srcElement.value;
}
</SCRIPT>

<!-- SAMPLE_STYLE_START -->
<LINK REL="stylesheet" href="../../../../../workshop/basicsdkie4.css" 
TYPE="text/css">
<!-- SAMPLE_STYLE_END -->
</HEAD>
<!--TOOLBAR_START-->
<!--TOOLBAR_EXEMPT-->
<!--TOOLBAR_END-->

<BODY TOPMARGIN=0 LEFTMARGIN=0 BGPROPERTIES="FIXED" BGCOLOR="#FFFFFF" 
LINK="#000000" VLINK="#808080" ALINK="#000000">
<BLOCKQUOTE CLASS="body">

<!-- Controls are grouped by giving them the same NAME but
     unique IDs. -->
<P>Grouped Radio Buttons<BR>
<INPUT TYPE=radio NAME=rdoTest ID=Cookies VALUE="accept_cookies" CHECKED             onclick="CookieGroup()"><BR>
<INPUT TYPE=radio NAME=rdoTest ID=NoCookies VALUE="refuse_cookies" onclick="CookieGroup()"><BR>
<P>Ungrouped Radio Button<BR>
<INPUT TYPE=radio NAME=rdoTest1 VALUE="chocolate-chip_cookies" onclick="CookieGroup()"><BR>
<P>Value of control on which the <B>onclick</B> event has fired<BR>
<TEXTAREA NAME=txtOutput STYLE="width:250"></TEXTAREA>

</BLOCKQUOTE>
</BODY>
</HTML>
