<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.0 Transitional//EN">
<HTML>
<HEAD>
<TITLE>Example of ondblclick Event</TITLE>
<META HTTP-EQUIV="Content-Type" CONTENT="text/html; CHARSET=iso-8859-1">
<META NAME="AUTHOR" CONTENT="InetSDK">
<META NAME="MS.LOCALE" CONTENT="EN-US">

<SCRIPT>
function addItem()
{
sNewItem = new Option(txtEnter.value)
selList.add(sNewItem, -1);
}
</SCRIPT>

<!-- SAMPLE_STYLE_START -->
<LINK REL="stylesheet" href="../../../../../workshop/basicsdkie4.css" 
TYPE="text/css">
<!-- SAMPLE_STYLE_END -->
</HEAD>
<!--TOOLBAR_START-->
<!--TOOLBAR_EXEMPT-->
<!--TOOLBAR_END-->

<BODY TOPMARGIN=0 LEFTMARGIN=0 BGPROPERTIES="FIXED" BGCOLOR="#FFFFFF" 
LINK="#000000" VLINK="#808080" ALINK="#000000">
<BLOCKQUOTE CLASS="body">

<P>Enter text and then double-click in the text box to add text to the list box.<BR><P>
<INPUT TYPE=text NAME=txtEnter VALUE="Enter_text" ondblclick="addItem()"><BR>
<SELECT NAME=selList SIZE=5></SELECT>
