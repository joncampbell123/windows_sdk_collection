<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 3.2//EN">
<HTML>

<HEAD>
<TITLE>Sample 19 - JavaScript version</TITLE>

<SCRIPT LANGUAGE="JScript">
<!--

function ToggleClip() {

if (ClipButton.value == "not clipped") {
ClipButton.value = "clipped";
Olivia1.style.clip = "rect(10 126 218 10)";
}
else {
ClipButton.value = "not clipped";
Olivia1.style.clip = "rect(0 136 228 0)";
}
}

//-->
</SCRIPT>
</HEAD>

<BODY BGCOLOR=#D3D3D3>

<IMG ID=Olivia1 STYLE="position:absolute; top:0px; left:0px; width:136px; height:228px; clip:rect(0 136 228 0)" src=olivia1.gif>
<P>
<INPUT ID=ClipButton TYPE=button VALUE="not clipped" STYLE="position:absolute; top:240px; left:0px" onClick="ToggleClip()">

</BODY>

</HTML>
