<SCRIPT LANGUAGE="JavaScript">
var bWin32IE;
if ((navigator.userAgent.indexOf("IE") != "-1") && (navigator.userAgent.length > 1)) {
bWin32IE = true;
} else {
bWin32IE = false;
}


function start(){
if (bWin32IE == true) {
WMPlay.CurrentPosition = 0;
WMPlay.play();
} else {
document.WMPlay.SetCurrentPosition(0);
document.WMPlay.Play();

}
}


function stop(){
if (bWin32IE == true) {
WMPlay.stop();
} else {
document.WMPlay.Stop();
document.WMPlay.SetCurrentPosition(0);
}
}
</SCRIPT>
