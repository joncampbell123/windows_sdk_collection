<BODY onload="oTxt.style.font='normal normal lighter 12pt arial'" TOPMARGIN=0 LEFTMARGIN=0 BGPROPERTIES="FIXED" BGCOLOR="#FFFFFF" 
LINK="#000000" VLINK="#808080" ALINK="#000000">
<BLOCKQUOTE CLASS="body">

<CENTER>

<!-- WE USE IN-LINE SCRIPTING TO SET FONT PROPERTIES: -->

<DIV ID="oTxt" onmouseover="this.style.font='italic small-caps bold 12pt serif'"
onmouseout="oTxt.style.font='normal normal lighter 12pt arial'">

Mouseover this text to make it italic, bold, 12-point, serif, small caps. Mouseout returns
the text to normal, lighter, 12-point, Arial.

</DIV>
