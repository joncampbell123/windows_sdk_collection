<script LANGUAGE="javascript" event="onload"> {

SHOWHASENDED="0";

}
</script>
<script LANGUAGE="javascript"> {
if (window.parent.document.all.ReplayButton) {
window.parent.document.all.ReplayButton.style.visibility = "hidden";
window.parent.document.all.LITTLE_BLUE_LINE.style.visibility = "hidden";
    }

<body BGCOLOR="#FFFFFF" TEXT="#000000" LINK="#000066" VLINK="#666666" TOPMARGIN="0" LEFTMARGIN="0">
<div id="Clock" align="left" style="padding:2;padding-left:5;font-family: Tahoma,Verdana,Arial,Helvetica; font-size:10pt; font-weight:bold; color:#000000">
<script LANGUAGE="JavaScript">
{

PAGE_COLOR = "#000094";

function noTime() {
 if (SHOW_TIME == "") {
     Clock.innerHTML = FEATURE_TITLE + " " + LOBBY_PAGE_LABEL;;
 if  (UPDATE_MESG != ""){
    window.parent.document.all.STATUS_TICKER.style.visibility = "visible";
Clock.innerHTML = UPDATE_MESG;
Clock.style.color = PAGE_COLOR;
  }

 if (ARCHIVE_URL !="") { 
     window.parent.document.all.ReplayButton.style.visibility = "visible";
     window.parent.document.all.LITTLE_BLUE_LINE.style.visibility = "visible";
 }
     else if ((window.parent.document.all.ReplayButton) && (window.parent.document.all.ReplayButton.style.visibility != "hidden")) 
         {
            window.parent.document.all.ReplayButton.style.visibility = "hidden";
            window.parent.document.all.LITTLE_BLUE_LINE.style.visibility = "hidden";
         }

}

}
  
function tick() {

noTime();

var daysToShow_none= "";
var hoursToShow_none= "";
var minutesToShow_none= "";
var secondsToShow_none= "";

var CLIENT_SHOW_TIME = new Date(SHOW_TIME);
var CLIENT_SHOW_END_TIME = new Date (SHOW_END_TIME);
var UTC_SERVER_SHOW_TIME = CLIENT_SHOW_TIME.toUTCString();
var CLIENT_CURRENT= new Date();

varSecondsMilli = 1000;
varMinutesMilli= varSecondsMilli * 60;
varHoursMilli = varMinutesMilli * 60;
varDaysMilli = varHoursMilli * 24;

var timeRemaining = ((CLIENT_SHOW_TIME.getTime()) - (CLIENT_CURRENT.getTime()));
var timeEndRemaining = ((CLIENT_SHOW_END_TIME.getTime()) - (CLIENT_CURRENT.getTime()));
  
if ((UPDATE_MESG !="")&& (timeEndRemaining > 0)){
  window.parent.document.all.STATUS_TICKER.style.visibility = "visible";
  Clock.innerHTML = UPDATE_MESG;
  Clock.style.color = PAGE_COLOR;
  }
else { 

if (timeRemaining > 0) {

var daysToShow= Math.floor (timeRemaining/ (1000 * 60 * 60 * 24));
timeRemaining -= daysToShow * varDaysMilli;
var hoursToShow= Math.floor (timeRemaining/ (1000 * 60 * 60));
timeRemaining -= hoursToShow * varHoursMilli;
var minutesToShow= Math.floor (timeRemaining/ (1000 * 60));
timeRemaining -= minutesToShow * varMinutesMilli;
var secondsToShow= Math.floor (timeRemaining/ (1000));

function makeTimeFriendly (time_interval, strTime_interval, days, hours, minutes, seconds)
{
   if ((minutesToShow < 1) && ((daysToShow==0) && (hoursToShow==0)))
    time_label = "";
   else {
   if (time_interval >= 2) 
     time_label = eval(strTime_interval + "_plural");
   if (time_interval == 1) 
      time_label = eval(strTime_interval + "_singular");
   if ((time_interval == 0) && (daysToShow || hoursToShow || minutesToShow || secondsToShow ==0))
      time_label = eval(strTime_interval + "_none");
  }

   return time_label;
}

function checkIfNotZero( toShow ) 
{
var nothing = "";

if (toShow==0)
return nothing
else
return toShow;
}

var timeToShow =   checkIfNotZero(daysToShow) + " " +makeTimeFriendly(daysToShow, "daysToShow", daysToShow, hoursToShow, minutesToShow, secondsToShow ) + " " + checkIfNotZero(hoursToShow)  + " " + makeTimeFriendly(hoursToShow, "hoursToShow", daysToShow, hoursToShow, minutesToShow, secondsToShow) + " " + checkIfNotZero(minutesToShow) + " " + makeTimeFriendly(minutesToShow,"minutesToShow", daysToShow, hoursToShow, minutesToShow, secondsToShow) + " " +  checkIfNotZero(secondsToShow) + " " + makeTimeFriendly(secondsToShow, "secondsToShow", daysToShow, hoursToShow, minutesToShow, secondsToShow);

//timer countdown last message
if ((minutesToShow < 1) && ((daysToShow==0) && (hoursToShow==0))) {
   Clock.innerHTML = timetoshow_mesg;
    if ((window.parent.document.all.ReplayButton) && (window.parent.document.all.ReplayButton.style.visibility != "hidden")) 
         {
            window.parent.document.all.ReplayButton.style.visibility = "hidden";
            window.parent.document.all.LITTLE_BLUE_LINE.style.visibility = "hidden";
         }
}
else {
  Clock.innerHTML = STATUS_BEFORE  + timeToShow;
   if ((window.parent.document.all.ReplayButton) && (window.parent.document.all.ReplayButton.style.visibility != "hidden")) 
         {
            window.parent.document.all.ReplayButton.style.visibility = "hidden";
            window.parent.document.all.LITTLE_BLUE_LINE.style.visibility = "hidden";
         }
}
  window.setTimeout("tick();", 1000);
}

// during show
mpObject = window.parent.document.all.item ("NSPLAY1");
if (((timeRemaining < 0) && (timeEndRemaining > 0)) && ((mpObject != null) && (mpObject.PlayState =="2"))){
//Clock.innerHTML = STATUS_DURING;
         if ((window.parent.document.all.ReplayButton) && (window.parent.document.all.ReplayButton.style.visibility != "hidden")) 
         {
            window.parent.document.all.ReplayButton.style.visibility = "hidden";
            window.parent.document.all.LITTLE_BLUE_LINE.style.visibility = "hidden";
         }
}
else if (((timeRemaining < 0) && (timeEndRemaining > 0)) && ((mpObject) && (mpObject.PlayState != "2"))) {
Clock.innerHTML = timetoshow_mesg;
  }
// after show

if (timeEndRemaining <= 0)  {
  Clock.innerHTML = STATUS_AFTER;
  SHOWHASENDED="1";
  window.status = STATUS_AFTER;
  parent.window.status = STATUS_AFTER;
  if (ARCHIVE_URL !="" && window.parent.document.all.ReplayButton ) { 
            window.parent.document.all.ReplayButton.style.visibility = "visible";
            window.parent.document.all.LITTLE_BLUE_LINE.style.visibility = "visible";
 }
  else if ((window.parent.document.all.ReplayButton) && (window.parent.document.all.ReplayButton.style.visibility != "hidden")) 
         {
            window.parent.document.all.ReplayButton.style.visibility = "hidden";
            window.parent.document.all.LITTLE_BLUE_LINE.style.visibility = "hidden";
         }

}
}

}
window.onload = tick;
}


</script>

</div>

</body>
</html>
