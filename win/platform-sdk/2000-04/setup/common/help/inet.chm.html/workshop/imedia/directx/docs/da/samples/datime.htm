<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.0 Transitional//EN">
<HTML>
<HEAD>
<TITLE>Direct Animation</TITLE>
<XML:NAMESPACE PREFIX="t"/>
<XML:NAMESPACE PREFIX="anim"/>

<META HTTP-EQUIV="Content-Type" CONTENT="text/html; CHARSET=iso-8859-1">
<META NAME="AUTHOR" CONTENT="InetSDK">
<META NAME="MS.LOCALE" CONTENT="EN-US">

<!-- SAMPLE_STYLE_START -->
<LINK REL="stylesheet" href="../../../../../../workshop/basicsdkie4.css" TYPE="text/css">
<!-- SAMPLE_STYLE_END -->
<STYLE>
.time       { behavior: url(#TIME); }
anim\:DA{ behavior: url(#DEFAULT#ANIM); }
</STYLE>
<OBJECT ID="time" CLASSID="CLSID:476C391C-3E0D-11D2-B948-00C04FA32195">
</OBJECT>
</HEAD>

<BODY TOPMARGIN=0 LEFTMARGIN=0 BGPROPERTIES="FIXED" BGCOLOR="#FFFFFF" 
LINK="#000000" VLINK="#808080" ALINK="#000000">
<BLOCKQUOTE CLASS="body">
<BR>
<H3 ID="myText" STYLE="color:red;" CLASS="time" t:TIMEACTION="style" t:BEGIN="2" t:DUR="4">The image rotates while this text is displayed in red.</H3>
<DIV ALIGN="center">
    <anim:DA ID="da1" STYLE="position:relative; top:-50; width:200; height:200; z-index: -1;"/>
</DIV>
<BR>
<BUTTON onclick="myText.beginElement();">Restart</BUTTON>

<SCRIPT LANGUAGE="JScript">
<!--
   // Assign a variable to the DA statics library
   m = da1.statics;
   // Create a DAImage
   img1 = m.ImportImage("../../../../../../workshop/imedia/directx/docs/da/art/da.gif");   
   // Use the timeline on the <SPAN> text to drive the rotation. The animated 
   // progressBehavior number is multiplied by the number of radians in a circle.
   // This causes the image to rotate exactly once for the duration of the timeline.
   img2 = img1.Transform(m.Rotate2Anim(m.Mul(myText.progressBehavior, m.DANumber(6.28318))));  
   // Set the image to be displayed by the anim:DA element
   da1.image = img2;     
//-->  
</SCRIPT>
</BLOCKQUOTE>
</BODY>
</HTML>
