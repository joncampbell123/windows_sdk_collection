<SPAN CLASS="time" STYLE="Color:Purple; font-size:20pt;" t:TIMEACTION="display" t:DUR="1">1...</SPAN><BR>
<t:IMG CLASS="time" t:DUR="indefinite" t:src="/workshop/graphics/sun.gif">
</SPAN><BR>
<BUTTON ID="btn" onclick="sequence.beginElement();">Restart Timeline</BUTTON>
