<HTML>
<HEAD> 
<TITLE>timelineBehavior</TITLE>
<META HTTP-EQUIV="Content-Type" CONTENT="text/html; CHARSET=iso-8859-1">
<META NAME="AUTHOR" CONTENT="InetSDK">
<META NAME="MS.LOCALE" CONTENT="EN-US">

<!-- SAMPLE_STYLE_START -->
<LINK REL="stylesheet" href="../../../../workshop/basicsdkie4.css" TYPE="text/css">
<!-- SAMPLE_STYLE_END -->
<XML:NAMESPACE PREFIX="anim"/>
<STYLE>
.time       { behavior: url(#time);       }
anim\:DA{ behavior: url(#default#anim); }
</STYLE>
<OBJECT ID="time" CLASSID="CLSID:476c391c-3e0d-11d2-b948-00c04fa32195"></OBJECT>
</HEAD>
<!--TOOLBAR_START-->
<!--TOOLBAR_EXEMPT-->
<!--TOOLBAR_END-->

<BODY TOPMARGIN=0 LEFTMARGIN=0 BGPROPERTIES="FIXED" BGCOLOR="#FFFFFF" 
LINK="#000000" VLINK="#808080" ALINK="#000000">

<BLOCKQUOTE CLASS="body">
<P>The image begins rotating three seconds after the page loads, and continues rotating for five seconds.</P> 
<SPAN ID="spanImg" CLASS="time" t:TIMEACTION="visibility" t:BEGIN="3" t:DUR="5">
</SPAN>
<DIV ALIGN="center">
<anim:DA ID="da1" STYLE="width:200; height:200; z-index: -1;">
</DIV>
<BR>

<SCRIPT LANGUAGE="JScript">
<!--
   // Assign a variable to the DA statics library
   m = da1.statics;
   // Create the DAImage
   img1 = m.ImportImage("/workshop/graphics/sun.gif");
   // Rotate the image at a rate of 60 degrees/second
   img2 = img1.Transform(m.Rotate2RateDegrees(60));
   // Apply the HTML+TIME timeline to the DAImage
   img3 = img2.SubstituteTime(spanImg.timelineBehavior); 
   da1.image = img3;
//-->  
</SCRIPT>
</BLOCKQUOTE>
</BODY>
</HTML>
