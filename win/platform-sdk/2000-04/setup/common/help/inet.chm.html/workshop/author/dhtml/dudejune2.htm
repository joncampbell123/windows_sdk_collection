<html>
<head>
<title>Sticky Positioning Without Script</title>
<style type="text/css"><!-->>

   BODY {font-family: arial; font-size: 18pt; font-weight: bold;}
   DIV { width: 80px; height: 80px; text-align: center; position: absolute;  }

--></style>

<script language="JavaScript"><!--

var isIE5 = navigator.appVersion.indexOf("MSIE 5.")>0
if (!isIE5) 
alert("Please load Internet Explorer 5 to view this example.");

//--></script>
</head>
<body><script language="javascript">
if (window.name != "content")
    document.write("<center><a href='../../../index.html?page=workshop/author/dhtml/dudejune2.htm'>show framing</a></center>")
</script>
<!--TOOLBAR_START-->
<!--TOOLBAR_EXEMPT-->
<!--TOOLBAR_END-->




<div onclick="alert(this.clientWidth);" id=Blue style="left: function(document.body.clientLeft + 10);
                    top: function(document.body.clientTop + 10);
                    background: blue;">
Top Left</div>

<div id=Red style="left: function(document.body.clientLeft + 10);
                   top: function(document.body.clientHeight - document.body.style.border - 90);
                   background: red;">
Bottom Left</div>

<div id=Green style="left: function(document.body.clientWidth - 90);
                     top: function(document.body.clientTop + 10);
                     background: green;">
Top Right</div>

<div id=Yellow style="left: function(document.body.clientWidth - 90);
                      top: function(document.body.clientHeight - document.body.style.border - 90);
                      background: yellow;">
Bottom Right</div>

<div id=Purple style="left: function((document.body.clientWidth - 80)/2);
                      top: function((document.body.clientHeight - 80)/2);
                      background: purple;">
Center</div>

</body>
</html>
