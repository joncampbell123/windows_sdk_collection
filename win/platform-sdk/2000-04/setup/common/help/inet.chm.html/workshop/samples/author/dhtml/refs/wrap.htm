function ChangeWrap(oSelect, oTA)
{
cValue = oSelect.options(oSelect.selectedIndex).value;
oTA.wrap = cValue;
}

function HandleSubmit()
{
alert(form1.method + ', ' + form1.action);
}

<H1>Wrap Property Example</H1>

<FORM ID="form1">
<B>TEXTAREA.wrap</B> = <SELECT ID="cboWrap" onchange="ChangeWrap(this, txt1)">
<OPTION VALUE=soft SELECTED>soft
<OPTION VALUE=hard>hard
<OPTION VALUE=off>off
</SELECT>
<P>
<TEXTAREA ID="txt1" STYLE="height:100;width:200">
Add some text to this TEXTAREA to see the effect of the wrap property.
</TEXTAREA>
</FORM>
