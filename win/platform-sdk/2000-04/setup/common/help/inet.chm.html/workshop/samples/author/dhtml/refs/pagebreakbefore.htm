<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.0 Transitional//EN">
<HTML>
<HEAD>
<TITLE>pageBreakBefore</TITLE>
<META HTTP-EQUIV="Content-Type" CONTENT="text/html; CHARSET=iso-8859-1">
<META NAME="AUTHOR" CONTENT="InetSDK">
<META NAME="MS.LOCALE" CONTENT="EN-US">

<LINK REL="stylesheet" href="samplessdkie4.css" TYPE="text/css">

<!-- THIS FUNCTION TURNS OFF THE PAGE BREAK WHEN THE BUTTON IS CLICKED -->

<SCRIPT>
function offBreak() {
Paragraph.style.pageBreakBefore="";
}
</SCRIPT>
</HEAD>
<!--TOOLBAR_START-->
<!--TOOLBAR_EXEMPT-->
<!--TOOLBAR_END-->

<BODY TOPMARGIN=0 LEFTMARGIN=0 BGPROPERTIES="FIXED" BGCOLOR="#FFFFFF" 
LINK="#000000" VLINK="#808080" ALINK="#000000">
<BLOCKQUOTE CLASS="body">

<CENTER>
<BR><BR>

<!-- CLICKING THE BUTTON FIRES OFF THE SCRIPT ABOVE, TURNING OFF THE PAGE BREAK -->

<BUTTON onclick="offBreak()">Turn off break</BUTTON>
<P ID="Paragraph" STYLE="page-break-before='always'; text-align:left"><BLOCKQUOTE>When you print this page, there
will be a page-break before this first paragraph unless you click the "Turn off break" button.</BLOCKQUOTE>
</P>

<BR><BR><BR>
<HR>
[to view the source code, right-click anywhere on the window]
</CENTER>
