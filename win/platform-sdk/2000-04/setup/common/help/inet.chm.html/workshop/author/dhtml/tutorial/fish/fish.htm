<!--
'
'  FishStuff
'
Dim CurrentFish
Dim FoodOffX
Dim FoodOffY
Dim FishWidth
Dim FishHeight
Dim fishDir
dim OKtoEat

SUB Window_Onload
Randomize
fishDir = "left"
FoodOffY = Cint(Food.STYLE.posHEIGHT / 2)
FoodOffX = Cint(Food.Style.posWidth / 2)
FishWidth = Cint(LeftFish.Style.posWidth / 2)
FishHeight = Cint(LeftFish.Style.posHeight / 2)
Food.stop
Food.FrameMap="1,0.200; 2,0.100; 3,0.200; 4,0.200"
OKtoEat = true
End Sub

Sub Document_onClick()
' Get where the user clicked
x=window.Event.X
y=window.Event.Y

' Move and play the food
Food.stop
Food.Repeat = -1
Food.FinalFrame = 0
Food.FrameMap="1,0.200; 2,0.100; 3,0.200; 4,0.200"
Food.Style.PosTop  = Cint(Y - FoodOffY/2)
Food.Style.PosLeft = X - FoodOffX
Food.play

if fishDir = "left" then
if pathLeft.playState <> 0 then
OKtoEat = false
PathLeft.Stop
end if
curX = int(LeftFish.Style.PosLeft)
curY = int(LeftFish.Style.PosTop)
else
if pathRight.playState <> 0 then
OKtoEat = false
PathRight.Stop
end if
curX = int(rightFish.Style.PosLeft)
curY = int(rightFish.Style.PosTop)
end if
OKtoEat = true

if (x > curX + FishWidth) and (fishDir = "left") then
leftFish.style.visibility = "hidden"
fishDir = "right"
rightFish.Style.pixelLeft = curX
rightFish.Style.pixelTop = curY
rightFish.Style.Visibility = "visible"
elseif (x <= curX + FishWidth) And (fishDir = "right") Then
rightFish.style.visibility = "hidden"
fishDir = "left"
leftFish.Style.pixelLeft = curX
leftFish.Style.pixelTop = curY
leftFish.Style.Visibility = "visible"
END IF

'  Set X points
startX = CurX

' Adjust for fish border so that the nose goes into the food
if fishDir = "right" then
endX = Cint(X - (FishWidth * 2) + 50)
else
endX = X - 25
end if

startY = curY
endY   = Cint(Y - FishHeight - 30)

if fishDir = "left" then
KeyFrameArray = Array(curX, curY, endX, endY)
pathLeft.Polyline 2, KeyFrameArray
pathLeft.Play
else
KeyFrameArray = Array(curX, curY, endX, endY)
pathRight.Polyline 2, KeyFrameArray
pathRight.Play
end if

END SUB

sub eatFood
  if OKtoEat then
Food.stop
Food.Repeat = 1
Food.FrameMap="5,0.200; 6,0.100; 7,0.200; 8,0.100; 9,0.100"
Food.FinalFrame = 5
Food.play
  end if
end sub

sub pathLeft_onStop
  eatFood
end sub

sub pathRight_onStop
  eatFood
end sub

sub waterToggle_onClick
  x = window.Event.X
  if x < 350 then
    if water.currentState = 2 then
      water.stop
    else
      water.run
    end if
    window.event.cancelBubble = true
  end if
end sub

//-->
</SCRIPT>
