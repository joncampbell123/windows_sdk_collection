<SCRIPT LANGUAGE="JavaScript"><!--

//------------------------------------------------------------------------------------------
// Search for all sTerm strings in sTarget string and replace them with sRepl
//------------------------------------------------------------------------------------------

function sRepl(sTarget, sTerm, sRepl) {

   var sWork = sTarget;
   var ind = 0;
   var next = 0;

   while ((ind = sWork.indexOf(sTerm, next)) >= 0) {
      sWork = sWork.substring(0, ind) + sRepl + 
         sWork.substring(ind + sTerm.length, sWork.length); 
      next = ind + sRepl.length;
      if (next >= sWork.length) { break; } 
   }
   return sWork;
}
   
//-------------------------------
// Sniff
//-------------------------------

var sAgent = navigator.userAgent;
var bIsMac = sAgent.indexOf("Mac") > -1;
var bIsIE4 = sAgent.indexOf("IE 4")  > -1;
var bIsIE5 = sAgent.indexOf("IE 5")  > -1;
var bGetsNavFrame = (bIsIE4 || bIsIE5) && !bIsMac;
var bCHMBuild = true;

   //-------------------------------------------------------------------------------
   // Get the unescaped location.href
   // Set sTopicUrl to the hash value
   //-------------------------------------------------------------------------------

var sFullUrl = unescape(window.location.href);
var sTopicUrl = sFullUrl.substring(sFullUrl.indexOf("#") + 1);
      
//------------------------------------------------------------------------
// If we're not on the Web, change "\" into "/"
//------------------------------------------------------------------------

if (location.protocol == "http:") {
     sSlash = "/";
     sDefault = "default.asp";
}
else {
    sSlash = "\\";
    sDefault = "default.htm";
    sFullUrl = sRepl(sFullUrl, "\\", "/");
    sTopicUrl = sRepl(sTopicUrl, "\\", "/");
}
        
//------------------------------------------------------------------------
// If browser doesn't get NavFrame or location.hash is empty,
// send user to default page for last folder or, if in CHM build,
// dispense with frame set entirely.
// Otherwise, build the correct navframe frameset
//------------------------------------------------------------------------

if (!bGetsNavFrame || location.hash == "#" || location.hash == "" || bCHMBuild)
{
   if (bCHMBuild)
      location.href = sfullurl.substring(0, sFullUrl.indexOf("workshop/c-frame.htm")) + sTopicUrl.substring(sTopicUrl.indexOf("/") + 1);
   else 
      location.href = sfullurl.substring(0, sFullUrl.lastIndexOf("/") + 1) + sDefault;
}
else {
//-------------------------------------------------------------------------------
// Set sTocUrl to TOC root + toc.htm + "#" + sTopicUrl (for synching bold)
//-------------------------------------------------------------------------------

var sTocUrl = "/workshop/";
var aTocRoots = new Array
(
"/standards/",
"/xml/",
"/msagent/",

"/workshop/author/htmlhelp/",
"/workshop/imedia/windowsmedia/",
"/workshop/imedia/agent/",
"/workshop/languages/fp/",

"/workshop/essentials/",
"/workshop/delivery/",
"/workshop/components/",
"/workshop/database/",
"/workshop/design/",
"/workshop/author/",
"/workshop/languages/",
"/workshop/messaging/",
"/workshop/networking/",
"/workshop/browser/",
"/workshop/security/",
"/workshop/server/",
"/workshop/imedia/",
"/workshop/management/"
);
for (var i=0;i<aTocRoots.length;i++)
{
if (-1 != sTopicUrl.indexOf(sTocRoot = aTocRoots[i]))
{
sTocUrl = sTocRoot;
break;
}
}
sTocUrl += "toc.htm#" + sTopicUrl;

//-------------------------------------------------------------------------------
// Write the frameset
//-------------------------------------------------------------------------------

var sFrameset = '<FRAMESET COLS="172,*"><FRA' + 'ME NAME="TOC" src='
+ sTocUrl + ' MARGINWIDTH="0"><FRA' + 'ME NAME="TEXT" src='
+ sTopicUrl + ' MARGINWIDTH="0" SCROLLING="yes"></FRAMESET>';
document.write(sFrameset);
}

//--></SCRIPT>
