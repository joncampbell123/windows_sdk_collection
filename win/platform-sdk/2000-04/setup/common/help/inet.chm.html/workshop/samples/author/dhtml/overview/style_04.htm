<H1>Dynamic Styles Sample</H1>

<P>This sample demonstrates checking for inherited styles.
Click "Check CSS" to display the style inheritence of the following paragraph.
</P>

<P><INPUT TYPE=button value="Check CSS" onclick="fnCheckCSS()">
</P>
<div id="SetByClass" class=Class1>Set By Class</div>
<div style="font-family: arial">
      <div id="Inherited">Inherited</div>
</div>
<div id="DirectlySet" style="font-family: arial">Directly Set</div>
<div id="SetWithScript">Set with Script</div>
<script>
function fnCheckCSS(){
      alert("Set By Class: " + SetByClass.style.fontFamily);
      alert("Inherited: " + Inherited.style.fontFamily);
      alert("Directly Set: " + DirectlySet.style.fontFamily);
      SetWithScript.style.fontFamily = "arial";
      alert("Set With Script: " + SetWithScript.style.fontFamily);
}
</script>
