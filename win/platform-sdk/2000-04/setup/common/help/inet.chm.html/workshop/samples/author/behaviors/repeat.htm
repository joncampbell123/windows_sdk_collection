<!--TOOLBAR_START-->
<!--TOOLBAR_EXEMPT-->
<!--TOOLBAR_END-->

<BODY TOPMARGIN=0 LEFTMARGIN=0 BGPROPERTIES="FIXED" BGCOLOR="#FFFFFF" 
LINK="#000000" VLINK="#808080" ALINK="#000000">
<BLOCKQUOTE CLASS="body">
<P>Three paragraphs will be shown for three seconds each, on three second intervals, and the entire process will be repeated three times.
<SPAN ID="parent" CLASS=time t:BEGIN="0" t:DUR="9" t:TIMELINE="PAR" t:REPEAT="3" t:TIMEACTION="display">
<SPAN ID="span1" CLASS=time STYLE="COLOR:Red;" t:BEGIN="0" t:DUR="3" t:TIMEACTION="visibility">
<H3>Paragraph 1</H3>
<P>This is paragraph number one.</P>
</SPAN>
<SPAN ID="span2" CLASS=time STYLE="COLOR:Blue;" t:BEGIN="3" t:DUR="3" t:TIMEACTION="visibility">
<H3>Paragraph 2</H3>
<P>This is paragraph number two.</P>
</SPAN>
<SPAN ID="span2" CLASS=time STYLE="COLOR:Green;" t:BEGIN="6" t:DUR="3" t:TIMEACTION="visibility">
<H3>Paragraph 3</H3>
<P>This is paragraph number three.</P>
</SPAN>
</SPAN>
<!-- @ed a-sneill: The first time I tried this, paragraph 1 popped up under paragraph 2 and then disappeared. The second time, paragraph 2 actually replaced paragraph 1. -->
<!-- @WRITER a-scotv: Fixed this sample, should work properly now. -->
</BLOCKQUOTE>
</BODY>
</HTML>
