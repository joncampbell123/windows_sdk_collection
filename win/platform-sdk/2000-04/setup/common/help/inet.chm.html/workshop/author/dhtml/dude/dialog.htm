<html>
<body style="font-family: verdana">
<h2>New Dialog Features</h2>

<ul>
<li>Modeless
<li>Resizeable
<li>Control over Status Bar
</ul>

<br>

<input type=button value="Modal" onclick="doDialogModal()">
<input type=button value="Modeless" onclick="doDialogModeless()">

<script>
function doDialogModal() {
  window.showModalDialog("colordlg.htm", document, "resizable: yes; status: no")
}
function doDialogModeless() {
  window.showModelessDialog("colordlg.htm", document, "resizable: yes; status: no");
}
</script>
</body>
</html>
