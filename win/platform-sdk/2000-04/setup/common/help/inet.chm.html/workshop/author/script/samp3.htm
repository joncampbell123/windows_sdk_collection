
<head>
<title>Hidden Document Printing</title>
<LINK REL="STYLESHEET" href="/sitebuilder/shared/globalcss/sbnie4.css">
</head>

<body bgcolor="infobackground">

<p>This is a main page</p>
<script defer language=JScript src="print.js"></script>
<script defer src="printhid.js"></script>

<p><input disabled name="idPrint" type="button" value="Print this page" onclick="print()">
<input disabled name="idPrintFrame" type="button" value="Print the frame below"
onclick="printFrame(idFrame)"> </p>
<IFRAME style="visibility: visible" name="idFrame" width="50%" height="30%" src="frame.htm">
</IFRAME>

<p><input disabled name="idPrintHidden" type="button" value="Print hidden page"
onclick="printURL()"></p>

<script defer>
function window.onload() {
  idPrintHidden.disabled = false;
  idPrint.disabled = false;
  idPrintFrame.disabled = false;
}

function printURL() {
  idPrintHidden.disabled = true;
  // set to handle completition
  window.onprintcomplete = function() { 
    idPrintHidden.disabled = false;
  }
  // print the content
  printHidden("report.htm");
}
</script>
