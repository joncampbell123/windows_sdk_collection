<CENTER>
<P>The table rules are scripted using the <B>rules</B> property. Click a button to change the table appearance.</P>

<TABLE ID="oID_1" RULES="cols">
<TR>
<TD>EST</TD><TD>1am</TD><TD>8pm</TD>
</TR>
<TR>
<TD>CST</TD><TD>2am</TD><TD>9pm</TD>
</TR>
<TR>
<TD>MST</TD><TD>3am</TD><TD>10pm</TD>
</TR>
</TABLE>
<P>
<BUTTON onclick="oID_1.rules=''">No rules</BUTTON>
<BUTTON onclick="oID_1.rules='all'">All rules</BUTTON>
<BUTTON onclick="oID_1.rules='cols'">Col rules</BUTTON>
</P>
