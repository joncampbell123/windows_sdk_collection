<SCRIPT>

bNavBarVisible = false;

function applyTransition (oImg)
{
   oImg.filters.item(0).Apply();
   oImg.style.visibility = "visible";
   oImg.filters.item(0).Play();
}

function showIt(oDiv)
{
  oDiv.style.visibility= "visible";
}

  function FlyFromBottom (oDiv,stopY)
  {
     oDiv.style.pixelTop -= 5;
     if (oDiv.style.pixelTop <= stopY) 
       oDiv.style.pixelTop = stopY;
     else
     {
        copyDiv = oDiv;
        copyY   = stopY;
        window.setTimeout ("FlyFromBottom (copyDiv,copyY);", 10);
     }     
  }

  function FlyFromTop (oDiv,stopY)
  {
     oDiv.style.pixelTop += 5;
     if (oDiv.style.pixelTop >= stopY) 
       oDiv.style.pixelTop = stopY;
     else
     {
        copyDiv = oDiv;
        copyY   = stopY;
        window.setTimeout ("FlyFromTop (copyDiv,copyY);", 10);
     }     
  }

  function flyIn()
  { 

     navBar.style.pixelTop = document.body.offsetHeight;
     navBar.style.visibility= "visible";
     window.setTimeout ("FlyFromBottom (navBar,document.body.offsetHeight - 35);",10);
    
  }

  function flyOut()
  { 

     navBar.style.pixelTop = document.body.offsetHeight - 35;
     navBar.style.visibility= "visible";
     window.setTimeout ("FlyFromTop (navBar,document.body.offsetHeight);",10);
    
  }

  function slideNav()
  {
     if (!bNavBarVisible)
     {
        if ((event.x <= 200) && (event.y >= document.body.offsetHeight - 10))
        {
           bNavBarVisible = true;
           flyIn();
         
        }
     }

     else if ((event.x > 200) || (event.y < document.body.offsetHeight - 35))
     {
       bNavBarVisible = false;   
       flyOut ();
     }
      
  }

  function switchSlides()
  {

     // if any of the navigation buttons were pressed,
     // determine which button was pressed, and set cancelBubble = true;
     if (event.srcElement.tagName == "INPUT")
     {
        // go to next or previous
        if (event.srcElement.title == "First")
           location.href= "/workshop/samples/author/dhtml/howto/s1.htm";

        else if (event.srcElement.title == "Previous")
           location.href = "/workshop/samples/author/dhtml/howto/s6.htm";

        // cancelBubble so it doesn't bubble up
        event.cancelBubble = true;
     }
  }
</SCRIPT>

<SCRIPT LANGUAGE="JavaScript" FOR="pthOval" EVENT="onplaymarker">
   pthOval.Stop();   
</SCRIPT>

<!-- Start flying text through the oval path after the transition completes -->
<script language="JavaScript" for="MyImg" event="onfilterchange">
  showIt (TextToFly);
  pthOval.Play();
</script>
</HEAD>
<!--TOOLBAR_START-->
<!--TOOLBAR_EXEMPT-->
<!--TOOLBAR_END-->

<BODY onload="applyTransition(MyImg);" 
      onclick="switchSlides();"
      onmousemove="slideNav()" 
      BGCOLOR=BLACK LEFTMARGIN=0 TOPMARGIN=0 BOTTOMMARGIN=0 RIGHTMARGIN=0>  

<!-- This is the Background image that uses the "Box out" Transition-type -->
<IMG ID="MyImg" src="../../../../../workshop/samples/author/dhtml/graphics/microsoft.gif" WIDTH="100%" HEIGHT="100%"
     STYLE="position:absolute; left:0; top: 0; width:100%; height: 100%;
            filter:revealTrans(Duration=1.0, Transition=6); visibility:hidden;
            z-index:-50" border="0" alt="Microsoft logo">

<span ID="TextToFly" 
      STYLE="position: absolute; top: 125; left:70; visibility:hidden;
             font: bold 20pt 'Arial'; color:white">
 http://msdn.microsoft.com/workshop/</span>


<!-- DirectAnimation Path Control -->
<OBJECT ID="pthOval"  
CLASSID="CLSID:D7A7D7C3-D47F-11D0-89D3-00A0C90833E6">
<PARAM NAME="Duration"      VALUE="2">
<PARAM NAME="Shape"         VALUE="Oval(-800,125,1750,200)">
        <PARAM NAME="AddTimeMarker1" VALUE="1.0, HalfwayPt, 0">
<PARAM NAME="Target" VALUE="TextToFly">
</OBJECT>


<DIV ID="navBar" STYLE="visibility:hidden; position:absolute; width: 200; height:28; top:550; left:10">
  <INPUT TYPE="IMAGE" style="filter:alpha(opacity=60)" TITLE="First" src="/workshop/samples/author/dhtml/howto/first.gif" height="28" width="40" border="0" alt="transition button">
  <INPUT TYPE="IMAGE" style="filter:alpha(opacity=60)" TITLE="Previous" src="/workshop/samples/author/dhtml/howto/prev.gif" height="28" width="40" border="0" alt="transition button">
  <INPUT TYPE="IMAGE" DISABLED style="filter:alpha(opacity=40)" TITLE="Next"     src="/workshop/samples/author/dhtml/howto/next.gif" height="28" width="40" border="0" alt="transition button">
  <INPUT TYPE="IMAGE" DISABLED style="filter:alpha(opacity=40)" TITLE="Last"     src="/workshop/samples/author/dhtml/howto/last.gif" height="28" width="40" border="0" alt="transition button">
</DIV>
