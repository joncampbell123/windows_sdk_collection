<STYLE>
BODY       {  background-color: black;color: gold;font: 24pt sans-serif;  }
TABLE      {  font: 30pt "Comic Sans MS";color: black;  }
#celSlide  {  letter-spacing: 10;color: cyan;  }
</STYLE>
<SCRIPT>
<!----------------Global Variable Declarations----------->
var sColor1="white";
var sColor2="gray";
var iColorLoop=0;
var iCurrentCELL=0;
var bAscending=true;
<!------------------------------------------------------->

celColorChange=new Array(iCurrentCELL)

function cycleColors()
{
if (bAscending)
    {
with(document.all)
celColorChange[iCurrentCELL].style.color=sColor2;
iCurrentCELL++;

if (iCurrentCELL>4)
       {
    bAscending=false;
    iCurrentCELL=4;
       }
    }
else
    {
with(document.all)
celColorChange[iCurrentCELL].style.color=sColor1;
   iCurrentCELL--;
   if (iCurrentCELL==0)
       {
    bAscending=true;
    changeColors();
       }
    }
}

function changeColors()
{
switch (iColorLoop)
   {
   case 0:
sColor1="yellow";
sColor2="orange";
break;
   case 1:
sColor1="hotpink";
sColor2="purple";
break;
   case 2:
sColor1="aqua";
sColor2="blue";
break;
   case 3:
sColor1="lightgreen";
sColor2="green";
   }
 iColorLoop++;
 if (iColorLoop>3)
     iColorLoop=0;
}
</SCRIPT>
</HEAD>
