<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.0 Transitional//EN">
<HTML>
<HEAD><TITLE>Timer Demos</TITLE>
<SCRIPT>
function init()
{
makeFlash(bob)
setInterval("fred.filters.alpha.opacity = (fred.filters.alpha.opacity + 5) % 101", 100)
setInterval("foo(dave)", 100)
}
var delta = 5
function foo(obj)
{
if ((obj.filters.alpha.opacity + delta > 100)
||  (obj.filters.alpha.opacity + delta < 0))
delta = - delta
obj.filters.alpha.opacity += delta
}
function makeFlash(obj)
{
obj.flashTimer = setInterval("bob.filters.glow.enabled = !bob.filters.glow.enabled", 1000)
}
function stopFlash(obj)
{
clearInterval(obj.flashTimer)
}
</SCRIPT>
<META HTTP-EQUIV="Content-Type" CONTENT="text/html; CHARSET=iso-8859-1">

<!-- SAMPLE_STYLE_END -->
</HEAD>

<!--TOOLBAR_EXEMPT-->
<!--TOOLBAR_END-->

<BODY onload="init()" TOPMARGIN=0 LEFTMARGIN=0 BGPROPERTIES="FIXED" BGCOLOR="#FFFFFF" LINK="#000000" VLINK="#808080" ALINK="#000000">
<BLOCKQUOTE CLASS="body">


<DIV id="bob" style="width:50%; filter:glow(Color=#FAF900,Strength=2,enabled=0);" onclick="stopFlash(this)"><H1>Here is some text<HR SIZE=1></H1></DIV>
<DIV id="fred" style="width:50%; filter:alpha(opacity=100);"><H1>Here is some text<HR SIZE=1></H1></DIV>
<DIV id="dave" style="width:50%; filter:alpha(opacity=50); color: blue"><H1>Here is some text<HR SIZE=1></H1></DIV>
