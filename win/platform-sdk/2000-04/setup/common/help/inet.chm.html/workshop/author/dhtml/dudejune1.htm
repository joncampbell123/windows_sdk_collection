<html>
<head>
<title>Sticky Positioning With Script</title>
<style type="text/css"><!-->
   BODY {font-family: arial; font-size: 18pt; font-weight: bold;}
   DIV { width: 80px; height: 80px; text-align: center; position: absolute;  }
--></style>
</head>
<body><script language="javascript">
if (window.name != "content")
    document.write("<center><a href='../../../index.html?page=workshop/author/dhtml/dudejune1.htm'>show framing</a></center>")
</script>
<!--TOOLBAR_START-->
<!--TOOLBAR_EXEMPT-->
<!--TOOLBAR_END-->

<div id=Blue style="background: blue;">
Top Left</div>

<div id=Red style="background: red;">
Bottom Left</div>

<div id=Green style="background: green;">
Top Right</div>

<div id=Yellow style="background: yellow;">
Bottom Right</div>

<div id=Purple style="background: purple">
Center</div>
<script language="JavaScript"><!--

var isIE5 = navigator.appVersion.indexOf("MSIE 5.") > 0;

if (!isIE5) 
alert("Please load Internet Explorer 5 to view this example.");
else  {
Blue.style.setExpression("posLeft", "document.body.clientLeft + 10");
Blue.style.setExpression("posTop", "document.body.clientTop + 10");
Yellow.style.setExpression("posLeft", "document.body.clientWidth - 90");
Yellow.style.setExpression("posTop", "document.body.clientHeight - document.body.style.border - 90");
Red.style.setExpression("posLeft", "document.body.clientLeft + 10");
Red.style.setExpression("posTop", "document.body.clientHeight - document.body.style.border - 90");
Green.style.setExpression("posLeft", "document.body.clientWidth - 90");
Green.style.setExpression("posTop", "document.body.clientTop + 10");
Purple.style.setExpression("posLeft", "(document.body.clientWidth - 80)/2");
Purple.style.setExpression("posTop", "(document.body.clientHeight - 80)/2");
}

//--></script>
</body>
</html>
