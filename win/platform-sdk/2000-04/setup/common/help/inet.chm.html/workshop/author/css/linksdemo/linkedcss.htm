<!--The script required to cycle through the different style sheets-->
<script>
var currSheet;
var currIndex;
var totalSheets = 10;

function activateNext() {
  currSheet.disabled = true;
  currIndex++;
  if (currIndex >= totalSheets) 
     currIndex = 0;
  currSheet = document.styleSheets[currIndex];
  currSheet.disabled = false;
}


function initialize() {
  var i;

  for (i=0;i<document.styleSheets.length;i++) {
      if (document.styleSheets[i].disabled == false) {
           currSheet = document.styleSheets[i];
           currIndex = i;
      }
  }
}

window.onload=initialize;
</script>
