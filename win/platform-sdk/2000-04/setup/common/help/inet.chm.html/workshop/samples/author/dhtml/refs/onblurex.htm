<P>Click on each textbox to move focus from one to the next. An alert will display each time the <B>onblur</B> event fires.
<BR><BR>
<INPUT TYPE=TEXT NAME=txtFirstName VALUE="First Name" onblur="alert(event.srcElement.name)"><BR>
<INPUT TYPE=TEXT NAME=txtLastName VALUE="Last Name" onblur="alert(event.srcElement.name)"><BR>
<INPUT TYPE=TEXT NAME=txtPhone VALUE="Phone Number" onblur="alert(event.srcElement.name)"><BR>
