<html>
<body style="font-family: verdana">
<h3>Create a DIV; check out your DOM-modified document</h3>
<input type=button value="Make a Div!" onclick="CreateSomeElement();"><br><br>
<input type=button value="Click here to see the html you created" onclick="ShowMe();"><br><br>
<script>

var gNumClick=0;
var fAlreadyShown=0;

function CreateSomeElement() {
  var newElem1, newElem2, newText, parentElem;
  // keep track of the number of times the user created a new element (div); gNumClick is a global
  gNumClick+=1;

  parentElem = document.body;

  // create a new DIV and BR
  newElem1 = document.createElement("DIV");
  newElem2 = document.createElement("BR");

  // Add some text to give feedback to the user
  newText = document.createTextNode("This is the "+gNumClick+" DIV that you created");
  // insert the textNode as a childNode of the div 
  newElem1.insertBefore(newText, null);
  // use existing convention to assign an ID to the div
  newElem1.id = gNumClick;
  // insert the new DIV and BR at the end of the document
  parentElem.insertBefore(newElem1, null);
  parentElem.insertBefore(newElem2, null);
  // You've added something new; you can see changed source
  fAlreadyShown=0;
}

function ShowMe() {
  var newElem3, newElem4, parentElem;
  if(fAlreadyShown)
    {
    alert("You've already seen the new document in this form.");
    return;
    }
  fAlreadyShown=1;
  parentElem = document.body;
  // create a TEXTAREA and a textNode
  newElem3 = document.createElement("TEXTAREA");
  newElem4 = document.createTextNode("The HTML document with the elements you created:");
  // use a different DOM method - this one appends the new element after the parent's last child  
  parentElem.appendChild(newElem4);
  parentElem.appendChild(newElem3);
  // set attributes directly on HTML elements
  newElem3.value = parentElem.outerHTML;
  newElem3.style.height = "120pt";
  newElem3.style.width = "300pt";
  newElem3.style.color = "blue";
}

</script>
</body>
</html>
