<P>This sample uses the <b>RUBY</b> object to specify a string of text as an annotation or pronunciation guide.</P>

<DIV CLASS="samplearea">
<RUBY id="oRuby"><span style="font-family: Arial; font-size: 12pt;">Base text.</span><RT><span style="font-family: Arial; font-size: 8pt; color: red;">Ruby text</span></RUBY>
</div>
