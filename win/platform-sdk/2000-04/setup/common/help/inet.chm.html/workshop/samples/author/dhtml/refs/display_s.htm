<CENTER>
<BUTTON onclick="oTbl.style.display='none'">HIDE TABLE</BUTTON>
<BUTTON onclick="oTbl.style.display=''">SHOW TABLE</BUTTON>
<P>
<TABLE BORDER ID="oTbl">
<TR>
<TD>1,000</TD><TD>2,000</TD>
</TR>
</TABLE>
</P>
Notice that, unlike the <B>visibility</B> attribute, the physical space is not preserved when
the display is set to "none".
