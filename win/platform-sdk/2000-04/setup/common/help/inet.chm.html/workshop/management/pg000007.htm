<HTML>
<HEAD>
<TITLE>Sitebuilder Network Workshop - Sniffing the browser</TITLE>

<SCRIPT LANGUAGE="JavaScript">
<!--
var bMSIE = false;
var bMSIE3 = false, bMSIE4 = false, bMSIE4_beta = false, bMSIE4_01 = false, bMSIE5 = false;
var bNetscape = false;
var bNetscape_2 = false, bNetscape_3 = false, bNetscape_4 = false;

function browser()
{
    var ua = navigator.userAgent;
    var an = navigator.appName;

    // is it IE?
    bMSIE = (ua.indexOf("MSIE")>=1);
    if (bMSIE)
    {
        // IE3
        bMSIE3 = (ua.indexOf("MSIE 3.")>=1);

        // IE4
        var iMSIE4 = ua.indexOf("MSIE 4.");
        bMSIE4 = (iMSIE4>=1);
        if (bMSIE4)
        {
            var sMinorVer = ua.charAt(iMSIE4+8);
            // some folks are still running an IE4 beta!
            // (the Mac IE team used a 'p' to mark their beta)
            bMSIE4_beta = bMSIE4 && ((sMinorVer == "b") || (sMinorVer == "p"));
            bMSIE4_01 = bMSIE4 && (sMinorVer == "1");
        }
        // IE5
        bMSIE5 = (ua.indexOf("MSIE 5.")>=1);
    }
    else if (an == "Netscape")
    {
        bNetscape = true;
        appVer = parseInt(navigator.appVersion);
        if (appVer >= 4)
            bNetscape_4 = true;
        else if (appVer >= 3)
            bNetscape_3 = true;
        else
            bNetscape_2 = true;
    }
    // else please send your working sniffers for other browsers to michaele@microsoft.com
}

function fill_table()
{
    if (bMSIE)
        document.browserTable.Name.value = "Microsoft Internet Explorer";
    else if (bNetscape)
        document.browserTable.Name.value = "Netscape Navigator";
    else
        document.browserTable.Name.value = "Not supported";
        
    if (bMSIE3 || bNetscape_3)
        document.browserTable.Version.value = "3.x";
    else if (bMSIE4 || bMSIE4_01 || bNetscape_4)
        document.browserTable.Version.value = "4.x";
}

function sniffTheBrowser()
{
    browser();
    fill_table();
}
// -->
</SCRIPT>
</HEAD>

<BODY onLoad="sniffTheBrowser()">
<FONT FACE="Verdana, Arial, Helvetica" SIZE=2>
<HR>
<H2 ALIGN="center">Sniffing the browser from JavaScript</H2>
<BR>
<P>This page contains sample client-side script that runs as the document loads to determine your browser's version information.</P>

<NOSCRIPT> Sorry, your browser doesn't support JavaScript (so the sniff won't work). </NOSCRIPT>

  <FORM NAME="browserTable">
    <TABLE BORDER=0>
    
      <TR><TD COLSPAN=2><HR></TD></TR>

      <TR><TH COLSPAN=2 ALIGN="LEFT"><FONT FACE="Verdana, Arial, Helvetica">
        Browser Information:</FONT></TH></TR>

      <TR><TD><FONT FACE="Verdana, Arial, Helvetica" SIZE=2>
        <B>Name:</B> </FONT></TD>
        <TD> <INPUT TYPE="text" NAME="Name" Size="30"></TD></TR>

      <TR><TD><FONT FACE="Verdana, Arial, Helvetica" SIZE=2>
        <B>Version:</B> </FONT></TD>
        <TD> <INPUT TYPE="text" NAME="Version" Size="30"></TD></TR>

      <TR><TD COLSPAN=2><HR></TD></TR>

    </TABLE>
  </FORM>

<HR>
</FONT>
<SCRIPT>
document.writeln(navigator.userAgent);
document.writeln(navigator.appName);
</SCRIPT>
</BODY>
</HTML>
