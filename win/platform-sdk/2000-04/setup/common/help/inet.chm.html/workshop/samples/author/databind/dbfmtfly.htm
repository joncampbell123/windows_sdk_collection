<H2>Modifying DATAFORMATAS at Run-Time</H2>

<!-- 
   This is the standard object declaration for the TDC 
   Change the DataURL, UseHeader, and TextQualifier properties to apply them to your data set
-->
<OBJECT classid="clsid:333C7BC4-460F-11D0-BC04-0080C7055A83"
    ID="tdcComposer" HEIGHT=0 WIDTH=0>
<PARAM NAME="DataURL" VALUE="/workshop/samples/author/databind/composer.csv">
<PARAM NAME="UseHeader" VALUE="True">
    <PARAM NAME="TextQualifier" VALUE="'">
</OBJECT>

<!-- 
   Note: The table is not used in the binding. It's only used to align the fields.
-->
<P>
<TABLE>
<TR><TD CLASS="ColumnLabel">First Name</TD><TD><SPAN DATAsrc="#tdccomposer" DATAFLD="compsr_first"></SPAN></TD></TR>
<TR><TD CLASS="ColumnLabel">Last Name</TD><TD><SPAN DATAsrc="#tdccomposer" DATAFLD="compsr_last"></SPAN></TD></TR>
<TR><TD CLASS="ColumnLabel">Biography</TD><TD><DIV ID="divBio" DATAsrc="#tdccomposer" DATAFLD="bio" DATAFORMATAS="HTML"></DIV></TD></TR>
</TABLE>

Render Biography As <SELECT ID="cboFormat" onchange="divBio.dataFormatAs=this.options(this.selectedIndex).value">
<OPTION VALUE=HTML SELECTED>HTML
<OPTION VALUE=Text>Text
</SELECT>
