<center>
<OBJECT ID="DAControl_ImageCycle" 
STYLE="width:300;height:50"
CLASSID="CLSID:B6FFC24C-7E13-11D0-9B47-00C04FC2F51D">
</OBJECT>
</center>


<SCRIPT LANGUAGE="JScript">

m = DAControl_ImageCycle.MeterLibrary;

//This defines the pause and transition times for the image cycling

var rampTime = 2;
var pauseTime = 3;
var totalTime = rampTime + pauseTime;


//Create the transform

theTransform = new ActiveXObject("DXImageTransform.Microsoft.CrSlide");


//Set the transform properties

theTransform.SlideStyle = "SWAP"


//Load in the images we are going to cycle through

inputs = new Array(5);      
inputs[0] = m.ImportImage("../art/banner1.gif");
inputs[1] = m.ImportImage("../art/banner2.gif");
inputs[2] = m.ImportImage("../art/banner3.gif");
inputs[3] = m.ImportImage("../art/banner4.gif");
inputs[4] = m.ImportImage("../art/banner5.gif");


//Set up the behavior for progress

rampUp = m.Interpolate(0, 1, rampTime );
pauseMode = m.DANumber(1).Duration(pauseTime);
progress = m.Sequence( rampUp, pauseMode ).RepeatForever();


//Create two new image behaviors

inputImg1 = new ActiveXObject("DirectAnimation.DAImage");
inputImg2 = new ActiveXObject("DirectAnimation.DAImage");


//Define their time dependence, so that they switch in the
//proper sequence to make the transitions smooth

inputImg1.Init(
m.Until( inputs[0], m.Timer(totalTime), 
m.Until( inputs[1], m.Timer(totalTime),
m.Until( inputs[2], m.Timer(totalTime),
m.Until( inputs[3], m.Timer(totalTime),
m.Until( inputs[4], m.Timer(totalTime),
inputImg1 
) ) ) ) ) ); 
inputImg2.Init(//Note this is one index offset from the first
m.Until( inputs[1], m.Timer(totalTime), 
m.Until( inputs[2], m.Timer(totalTime),
m.Until( inputs[3], m.Timer(totalTime),
m.Until( inputs[4], m.Timer(totalTime),
m.Until( inputs[0], m.Timer(totalTime),
inputImg2 
) ) ) ) ) ); 


//Apply the transform to the time-dependent inputs.

result = m.ApplyDXTransform( theTransform, new Array( inputImg1, inputImg2), progress);


//Assign the output behavior to the DAControl and start it.
DAControl_ImageCycle.Image = result.OutputBvr;
DAControl_ImageCycle.Start();

</SCRIPT>
