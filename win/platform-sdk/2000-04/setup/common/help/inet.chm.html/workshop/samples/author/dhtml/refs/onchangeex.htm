<FORM>
<P>Select a different option in the <BR>
   drop-down listbox to trigger the <B>onchange</B> event.
  <SELECT NAME=selTest onchange="alert('Index: ' + this.selectedIndex + '\nValue: ' + this.options[this.selectedIndex].value)">
    <OPTION VALUE="Books">Books
    <OPTION VALUE="Clothing">Clothing
    <OPTION VALUE="Housewares">Housewares
  </SELECT>
</FORM>
