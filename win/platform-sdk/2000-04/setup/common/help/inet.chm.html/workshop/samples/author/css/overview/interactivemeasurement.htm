<SCRIPT>
var aTips=new Array();
aTips[aTips.length]=new Tip("CSS","Layout",'Did you know that you can set the <a href="../../../../../workshop/author/dhtml/reference/properties/margin.htm">margin</a>, <a href="../../../../../workshop/author/dhtml/reference/properties/border_0.htm">border</a>, and <a href="../../../../../workshop/author/dhtml/reference/properties/padding.htm">padding</a> properties on inline elements such as <a href="../../../../../workshop/author/dhtml/reference/objects/a.htm">A</a> and <a href="../../../../../workshop/author/dhtml/reference/objects/span.htm">SPAN</a> elements?  Just give these elements layout by setting the <a href="../../../../../workshop/author/dhtml/reference/properties/height_0.htm">height</a> or <a href="../../../../../workshop/author/dhtml/reference/properties/width_0.htm">width</a> properties.');
aTips[aTips.length]=new Tip("InetSDK","FTE","Did you know that the writers for the InetSDK should win the Nobel Peace Prize for their perseverence against the tyranny of unclear documentation?");
window.onload=fnInit;
window.onerror=fnTrapError;
function Tip(sTech,sGroup,sData){
this.tech=sTech;
this.group=sGroup;
this.data=sData;
}
function fnTrapError(sMsg,sUrl,sLine){
alert(sLine);
return false;
}
function fnInit(){
//fnRandomTip();
fnSetNote("<B>Instructions:</B> Click and drag the element within the white square to change its position.  Select a pair of measurement or location properties from the drop down menu.  Markers are drawn for the property values in the window.");
//alert(typeof(oTarget.fxCalcPoints));
}

function fnRandomTip(){
var iRandomIndex=parseInt(Math.random()*aTips.length);
fnSetNote("<B>Today's Random Tip:</B> " + aTips[iRandomIndex].data);
}

function fnSetNote(sNote){
oTipText.innerHTML=sNote;
}
</SCRIPT>
