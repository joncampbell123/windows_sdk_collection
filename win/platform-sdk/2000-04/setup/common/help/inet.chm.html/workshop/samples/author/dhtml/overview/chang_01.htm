<HTML>
<HEAD><TITLE>Changing Object Attributes</TITLE>
<SCRIPT LANGUAGE="JavaScript">
 function change_image() {
   document.all.myiframe.src="/workshop/samples/author/dhtml/overview/frm_cnt2.htm";  
   //use the all collection to access attributes of the IFRAME object
}
function change_background() {
   document.frames.myiframe.document.body.style.backgroundColor="green";   
   // use the frames collection to access the document contained in the IFRAME.
}
</SCRIPT>
<META HTTP-EQUIV="Content-Type" CONTENT="text/html; CHARSET=iso-8859-1">

<BLOCKQUOTE CLASS="body">

<IFRAME id=myiframe src="/workshop/samples/author/dhtml/overview/frm_cnt1.htm">
</IFRAME>

<P><BUTTON onclick=change_image()>Change contents of the IFRAME</BUTTON></P>
<P><BUTTON onclick=change_background()>Change the background color of the IFRAME</BUTTON></P>
