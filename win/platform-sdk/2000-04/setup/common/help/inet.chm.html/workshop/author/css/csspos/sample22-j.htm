<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 3.2//EN">
<HTML>

<HEAD>
<TITLE>Sample 22 - JavaScript version</TITLE>

<SCRIPT LANGUAGE="JScript">
<!--

var TextVisible;

function StartMove() {

TextVisible = 1;
action = window.setInterval("MoveText()", 50);
}

function MoveText() {

if (TextVisible == 0) {
MovingText.style.pixelLeft += 10;
if (MovingText.style.pixelLeft == 0 ) {
TextVisible = 1;
}
} 
        else {
MovingText.style.pixelLeft -= 10;
if (MovingText.style.pixelLeft == -240 ) {
TextVisible = 0;
}
}
}

//-->
</SCRIPT>
</HEAD>

<BODY BGCOLOR=#D3D3D3 onload="StartMove()">

<SPAN ID=MovingText STYLE="position:relative; background-color:#FFB6C1">This text can whiz on and off the page.</SPAN>
<SPAN STYLE="position:relative; background-color:#ADD8E6">This text is a sibling of the moving red text.</SPAN>

</BODY>

</HTML>
