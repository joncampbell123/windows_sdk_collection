<SCRIPT>
bNavBarVisible = false;

function applyTransition (oImg)
{
   oImg.filters[0].Apply();
   oImg.style.visibility = "visible";
   oImg.filters[0].Play();
}

function addTitle()
{
  MyH1.style.visibility= "visible";
}



  function FlyFromBottom (oDiv,stopY)
  {
     oDiv.style.pixelTop -= 5;
     if (oDiv.style.pixelTop <= stopY) 
       oDiv.style.pixelTop = stopY;
     else
     {
        copyDiv = oDiv;
        copyY   = stopY;
        window.setTimeout ("FlyFromBottom (copyDiv,copyY);", 10);
     }     
  }

  function FlyFromTop (oDiv,stopY)
  {
     oDiv.style.pixelTop += 5;
     if (oDiv.style.pixelTop >= stopY) 
       oDiv.style.pixelTop = stopY;
     else
     {
        copyDiv = oDiv;
        copyY   = stopY;
        window.setTimeout ("FlyFromTop (copyDiv,copyY);", 10);
     }     
  }

  function flyIn()
  { 

     navBar.style.pixelTop = document.body.offsetHeight;
     navBar.style.visibility= "visible";
     window.setTimeout ("FlyFromBottom (navBar,document.body.offsetHeight - 35);",10);
    
  }

  function flyOut()
  { 

     navBar.style.pixelTop = document.body.offsetHeight - 35;
     navBar.style.visibility= "visible";
     window.setTimeout ("FlyFromTop (navBar,document.body.offsetHeight);",10);
    
  }

  function slideNav()
  {
     if (!bNavBarVisible)
     {
        if ((event.x <= 200) && (event.y >= document.body.offsetHeight - 35))
        {
           bNavBarVisible = true;
           flyIn();
         
        }
     }

     else  if ((event.x > 200) || (event.y < document.body.offsetHeight - 50))
     {
       bNavBarVisible = false;   
       flyOut ();
     }
  }

  function switchSlides()
  {

     // if any of the navigation buttons were pressed,
     // determine which button was pressed, and set cancelBubble = true;
     if (event.srcElement.tagName == "INPUT")
     {
        // go to next or previous
        if (event.srcElement.title == "Last")
           location.href= "/workshop/samples/author/dhtml/howto/s7.htm";

        else if (event.srcElement.title == "Next")
           location.href = "/workshop/samples/author/dhtml/howto/s2.htm";

        // cancelBubble so it doesn't bubble up
        event.cancelBubble = true;
     }

     else 
       location.href = "/workshop/samples/author/dhtml/howto/s2.htm";
  }  

</SCRIPT>

<BODY onload="applyTransition(MyImg);" 
      onclick="switchSlides();"
      onmousemove="slideNav()" 
      BGCOLOR="#000000" LEFTMARGIN=0 TOPMARGIN=0 BOTTOMMARGIN=0 RIGHTMARGIN=0>  

<H1 ID="MyH1" STYLE="visibility:hidden">Applying Transition on an Image<HR SIZE=1></H1>

<IMG ID="MyImg" src="../../../../../workshop/samples/author/dhtml/graphics/pdc97.jpg" STYLE="position:absolute; left:0; top: 0; width:100%; height: 100%; filter:revealTrans(Duration=3.0, Transition=1); visibility:hidden; z-index:-50" border="0" alt="PDC splash screen">

<DIV ID="navBar" STYLE="visibility:hidden; position:absolute; width: 200; height:28; top:550; left:10">
  <INPUT TYPE="IMAGE" DISABLED style="filter:alpha(opacity=40)" TITLE="First" src="../../../../../workshop/samples/author/dhtml/graphics/first.gif" height="28" width="40" border="0" alt="transition button">
  <INPUT TYPE="IMAGE" DISABLED style="filter:alpha(opacity=40)" TITLE="Previous" src="../../../../../workshop/samples/author/dhtml/graphics/prev.gif" height="28" width="40" border="0" alt="transition button">
  <INPUT TYPE="IMAGE" style="filter:alpha(opacity=60)" TITLE="Next"     src="../../../../../workshop/samples/author/dhtml/graphics/next.gif" height="28" width="40" border="0" alt="transition button">
  <INPUT TYPE="IMAGE" style="filter:alpha(opacity=60)" TITLE="Last"     src="../../../../../workshop/samples/author/dhtml/graphics/last.gif" height="28" width="40" border="0" alt="transition button">
</DIV>
