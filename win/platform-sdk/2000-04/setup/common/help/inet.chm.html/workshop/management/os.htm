<HTML>
<HEAD>
<TITLE>Sitebuilder Network Workshop - Sniffing the Operating System</TITLE>

<SCRIPT LANGUAGE="JavaScript">
<!--

var bMSIE = false;
var bMSIE3 = false, bMSIE4 = false, bMSIE4_beta = false, bMSIE4_01 = false, bMSIE5 = false;
var bNetscape = false;
var bNetscape_2 = false, bNetscape_3 = false, bNetscape_4 = false;

function browser()
{
    var ua = navigator.userAgent;
    var an = navigator.appName;

    // is it IE?
    bMSIE = (ua.indexOf("MSIE")>=1);
    if (bMSIE)
    {
        // IE3
        bMSIE3 = (ua.indexOf("MSIE 3.")>=1);

        // IE4
        var iMSIE4 = ua.indexOf("MSIE 4.");
        bMSIE4 = (iMSIE4>=1);
        if (bMSIE4)
        {
            var sMinorVer = ua.charAt(iMSIE4+8);
            // some folks are still running an IE4 beta!
            // (the Mac IE team used a 'p' to mark their beta)
            bMSIE4_beta = bMSIE4 && ((sMinorVer == "b") || (sMinorVer == "p"));
            bMSIE4_01 = bMSIE4 && (sMinorVer == "1");
        }
        // IE5
        bMSIE5 = (ua.indexOf("MSIE 5.")>=1);
    }
    else if (an == "Netscape")
    {
        bNetscape = true;
        appVer = parseInt(navigator.appVersion);
        if (appVer >= 4)
            bNetscape_4 = true;
        else if (appVer >= 3)
            bNetscape_3 = true;
        else
            bNetscape_2 = true;
    }
    // else please send your working sniffers for other browsers to michaele@microsoft.com
}

var bWin16 = false; // includes Win31 and WinNT 3.51
var bWin95 = false;
var bWin98 = false;
var bWinNT = false;
var bMac = false, bMac68K = false, bMacPPC = false;
var bMSSun = false;

function os()
{
    var ua = navigator.userAgent;
   
   if (bMSIE)
   {
      //IE supported OS's
      bWin95 = (ua.indexOf("Windows 95")>=1);
      bWin98 = (ua.indexOf("Windows 98")>=1);
      bWinNT = (ua.indexOf("Windows NT")>=1);
      bWin16 = (ua.indexOf("Windows 3.1")>=1);
      bMac = (ua.indexOf("Mac")>=1);
      bMac68K = (ua.indexOf("Mac_68000")>=1);
      bMacPPC = (ua.indexOf("Mac_PowerPC")>=1);
      bMSSun = (ua.indexOf("SunOS")>=1)
   } 
   else if (bNetscape)
   {
      // NSCP supporte OS's
      bWin95 = (ua.indexOf("Win95")>=1);
      bWin98 = (ua.indexOf("Win98")>=1);
      bWinNT = (ua.indexOf("WinNT")>=1);
      bWin16 = (ua.indexOf("Win16")>=1);
      bMac = (ua.indexOf("Mac")>=1);
      if (bMac)
      {
         bMac68K = (ua.indexOf("68K")>=1);
         bMacPPC = (ua.indexOf("PPC")>=1);
      }
      // BUGBUG: this doesn't find any of Netscape's Unix versions
   }
}

function fill_table()
{
    if (bWin16)
        document.browserTable.Name.value = "Windows 3.1 or Windows 3.51";
    else if (bWin95)
        document.browserTable.Name.value = "Windows 95";
    else if (bWin98)
        document.browserTable.Name.value = "Windows 98";
    else if (bWinNT)
        document.browserTable.Name.value = "Windows NT";
    else if (bMac)
        document.browserTable.Name.value = "Macintosh";
    else if (bMSSun)
       document.browserTable.Name.value = "SunOS";
}

function sniffTheOS()
{
   browser();
    os();
    fill_table();
}
// -->
</SCRIPT>
</HEAD>

<BODY onLoad="sniffTheOS()">

<FONT FACE="Verdana, Arial, Helvetica" SIZE=2>
<HR>
<H2 ALIGN="center" FONT FACE="Verdana, Arial, Helvetica">Sniffing for operating system using JavaScript</H2>
<BR>
<P>This page contains sample client-side script that runs as the document loads to determine your operating system.</P>

<NOSCRIPT> Sorry, your browser doesn't support JavaScript, so our sniff won't work (sniff). </NOSCRIPT>

  <FORM NAME="browserTable">
    <TABLE BORDER=0>
    
      <TR><TD COLSPAN=2><HR></TD></TR>

      <TR><TH COLSPAN=2 ALIGN="LEFT"><FONT FACE="Verdana, Arial, Helvetica">
        Operating System Information:</TH></TR>

      <TR><TD><FONT FACE="Verdana, Arial, Helvetica" SIZE=2>
        <B>Name:</B> </TD>
        <TD> <INPUT TYPE="text" NAME="Name" Size="30"></TD></TR>

      <TR><TD COLSPAN=2><HR></TD></TR>

    </TABLE>
  </FORM>

<HR>
</FONT>
</BODY>
</HTML>
