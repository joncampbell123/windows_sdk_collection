<BODY BGCOLOR=WHITE>
 
<CENTER>
<H1>DirectAnimation Slideshow Demo<br>Using the Fade Transition</H1>

          
<OBJECT ID="DAControl"
  STYLE="width:561;height:399" 
  CLASSID="CLSID:B6FFC24C-7E13-11D0-9B47-00C04FC2F51D">
</OBJECT>

</CENTER>
<SCRIPT LANGUAGE="JScript">
<!--
 m = DAControl.MeterLibrary;

 transformName = "DXImageTransform.Microsoft.Fade";

// Load in all the images used by the transform

 numImages= 4;
 imgs = new Array(      
   m.ImportImage("../art/cedar.jpg"),
   m.ImportImage("../art/lefgada.jpg"),
   m.ImportImage("../art/joten.jpg"),
   m.ImportImage("../art/bryce.jpg"));

 frame = m.ImportImage("../art/frame.gif");

 transitionTime= 2;//sec
 pauseTime= 2;//sec
 numRepeats = 2;
 totalTime = transitionTime + pauseTime;

//
// Setup the DANumber bevhavior which will drive the transform Progress
//
 holdStart= m.DANumber(0).Duration( pauseTime );
 transition = m.Interpolate(0, 1, transitionTime );
 progress= m.Sequence(holdStart, transition);

//
// Create an array to store the transform image behaviors.
//
 finalArray = new Array(numImages);

 for (i=0; i<numImages; i++){
   result = m.ApplyDXTransform( transformName, 
 new Array( imgs[i], imgs[(i+1) % numImages] ), 
 progress);
   finalArray[i] = result.OutputBvr.Duration(totalTime);
 }

//
// Assemble the sequence of transforms into the repeating image behavior
//
 transImage = m.Sequence(m.SequenceArray(finalArray).Repeat(numRepeats), imgs[0]);

// Overlay a frame with a transparent window
 finalImg = m.Overlay(frame, transImage);

// Assign the output to the DAControl
 DAControl.Image = finalImg;
          
// Start the animation       
 DAControl.Start();

//-->
</SCRIPT>

<p>
  This sample uses a single type of transform to transition between four different images, repeating the cycle once. With some small script changes it could use any number of images or a different kind of transition.

</BODY>
</HTML>
