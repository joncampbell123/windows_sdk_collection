<P>The text in this paragraph does not have a <B>font-variant</B> attribute applied to it.</P>

<!-- HERE WE USE AN INLINE STYLE TAG TO SET THE font-variant -->

<P STYLE="font-variant:'small-caps'">
This paragraph, however, has the <B>font-variant</B> set to <B>small-caps</B>. 
</P>
