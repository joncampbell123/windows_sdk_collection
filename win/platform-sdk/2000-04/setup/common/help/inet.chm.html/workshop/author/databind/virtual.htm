<html>
<head>
<!--TOOLBAR_START-->
<!--TOOLBAR_EXEMPT-->
<!--TOOLBAR_END-->
<xml id=LargeData src=dom2.xml>
</xml>

<style>
  #spacer {height: 22px; width: 25px; background-color: blue; visibility: hidden}
  #firstspacer {height: 22px; width: 25px; background-color: green; visibility: hidden}
  tr {color: yellow}
</style>

</head>

<BODY style="font-family: verdana; xfont-size: 10px">

<h2>Virtual Data Bound List</h2>

<div style="background-color: black; color: white; font-weight: bold">DOM Method or Property</div>
<div id=ScrollContainer style="overflow: scroll; background-color: blue; color: yellow; width: 100%; height: 400px">
 <table border=1 id=TargetTable width=100% style="table-layout: fixed;border-collapse: collapse;" >
   <tbody id=TargetBody>
   </tbody>
 </table>
</div>

<table border=1 id=SourceTable datasrc=#largedata datapagesize=20 width=100% style="table-layout: fixed; display: none">
  <tr>
    <td>
      <div datafld=data></div>
    </td>
  </tr>
</table>


<script>
var TotalRecordCount;
var ScrollBuffer = 50;
var LastRecordNumber = -1;

// this method actually moves the data from the bound table to the virtual table on demand
// it detects when all the data has been copied, and stops the transfer
function copyRows() {
  var i, copyRow, row;
 
  for (i=0; i<SourceTable.rows.length; i++) {
     row = SourceTable.rows[i];
     // test if all data copied
     if (row.recordNumber <= LastRecordNumber) {
       // if so, no more data to copy, so unhook
       ScrollContainer.onscroll = null;
       SourceTable.onreadystatechange = null;
       return;
     }

     // this uses new DOM functionality to deep copy the row from the table
     copyRow = row.cloneNode(true);
     TargetBody.insertBefore(copyRow, null);
     // this is used to keep track of how many rows are copied, to insure no duplicates
     LastRecordNumber = row.recordNumber;

     // removes a placeholder for scrolling for each row inserted in the vtable
     deletePlaceholder();
  }
}

// to make sure that the scroll bars are the right size, one spacer is created for each
// row that can be inserted. These are removed as real rows are created
function insertScrollBlocks() {
  var i, br;
  for (i=0; i<TotalRecordCount; i++) {
     br = document.createElement("SPAN");
     if (i == 0) {
       br.id = "firstspacer";       
     } else {
       br.id = "spacer";
     }
     br.style.display = "block";
     ScrollContainer.insertBefore(br, null);
  }
}     

// method to remove a placeholder when a real row is inserted
function deletePlaceholder() {
  p = document.all.spacer;
  if (p == null) 
    return;
  if (p.length != null) {
    brToRemove = p[p.length - 1];
    if (brToRemove == null)
      return;
    brToRemove.removeNode();
  }
}

// event handler for onscroll for the ScrollContainer (the div containing the vtable)
// each time the table is scrolled, we check to see if the last placeholder is close 
// to in view. if it is, we need to get more data.
function testForScroll() {
  if (ScrollContainer.scrollTop + ScrollContainer.offsetHeight + ScrollBuffer >= firstspacer.offsetTop)     {
    getMoreData();
  }
}   

// this function advances the page in the databound table
// note that the nextPage() method is asynch, and will return before the new data is in
// to resolve that problem, the onreadystatechange event is hooked in the databound table.
// this event is hooked by the dataAvailable() method
function getMoreData() {
  if (SourceTable.readyState != "complete") 
    return;

  SourceTable.nextPage();
}

// when the databound table is readyState == complete, this alerts that there is new data to transfer
// this method calls the copyRows() method, then calls testForScroll() to handle the case where the 
// thumb has been moved by a large amount
function dataAvailable() {
  if (SourceTable.readyState == "complete") {
    copyRows();
  }
  testForScroll();
}

// onload handler for the document.
function doLoad() { 
  // figure out total size of virtual list, to get spacers right
  TotalRecordCount = LargeData.recordset.recordcount - 10; 

  // insert spacers into the vtable
  insertScrollBlocks();

  // hook scrolling and data events
  ScrollContainer.onscroll = testForScroll;
  SourceTable.onreadystatechange = dataAvailable;

  // initialize the first set of data
  testForScroll();
}

window.onload = doLoad;

</script>

</body>
</html>
