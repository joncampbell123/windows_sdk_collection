<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.0 Transitional//EN">
<HTML>
<HEAD>
<TITLE>Example of the onpropertychange Event</TITLE>
<META HTTP-EQUIV="Content-Type" CONTENT="text/html; CHARSET=iso-8859-1">
<META NAME="AUTHOR" CONTENT="InetSDK">
<META NAME="MS.LOCALE" CONTENT="EN-US">

<STYLE>
P  { font-family:sans-serif; font-size:12pt; font-weight:bolder; }
</STYLE>
<SCRIPT>
function changeProp()
{
oProp.value = "This is the new VALUE";
}

function changeCSSProp()
{
oStyleProp.style.backgroundColor = "aqua";
}
</SCRIPT>

<!-- SAMPLE_STYLE_START -->
<LINK REL="stylesheet" href="../../../../../workshop/basicsdkie4.css" 
TYPE="text/css">
<!-- SAMPLE_STYLE_END -->
</HEAD>
<!--TOOLBAR_START-->
<!--TOOLBAR_EXEMPT-->
<!--TOOLBAR_END-->

<BODY ID="bdyChange" TOPMARGIN=0 LEFTMARGIN=0 BGPROPERTIES="FIXED" BGCOLOR="#FFFFFF" 
LINK="#000000" VLINK="#808080" ALINK="#000000">
<BLOCKQUOTE CLASS="body">

<P>The event object property <B>srcElement</B> is used in this code
   to identify on which object the <B>onpropertychange</B> event
   has fired.</P>
<P>The event object property <B>propertyName</B> is used here
   to return which property has been altered.</P>

<P>
<INPUT TYPE=button ID="oProp" onclick="changeProp()"
       VALUE="Click to change the VALUE property of this button"
       onpropertychange='alert(event.srcElement.id + " received a change to " +
   event.propertyName)'></P>
<P>
<INPUT TYPE=button ID="oStyleProp"
       onclick="changeCSSProp()"
   VALUE="Click to change the CSS backgroundColor property of this button"
       onpropertychange='alert(event.srcElement.id + " received a change to " +
   event.propertyName)'></P>
